<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2f3d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BREQUE" />
  <meta name="description" content="BREQUE — Copiloto contra golpes. Interrompa decisões sob pressão, verifique por outro canal e aja com calma." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>BREQUE — Copiloto contra golpes</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafb;
      --text: #0f1b24;
      --text-muted: #4b5c6b;
      --brand: #0f2f3d;
      --brand-2: #17465a;
      --brand-soft: #e6f0f4;
      --accent: #b45309;
      --accent-bg: #fff8eb;
      --accent-border: #f3d092;
      --risk: #991b1b;
      --risk-bg: #fef2f2;
      --risk-border: #f2bcbc;
      --neutral-bg: #eef2f5;
      --neutral-border: #cfd8e0;
      --border: #e1e7ec;
      --radius: 18px;
      --radius-sm: 13px;
      --shadow-sm: 0 2px 8px rgba(15, 27, 36, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 47, 61, 0.12);
      --font-scale: 1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: calc(16px * var(--font-scale));
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: #dce3e9;
      color: var(--text);
      line-height: 1.48;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 40px rgba(15, 27, 36, 0.12);
    }

    .proto-strip {
      background: #102a36;
      color: #e6f1f6;
      font-size: 0.82rem;
      line-height: 1.35;
      text-align: center;
      padding: 9px 14px;
      font-weight: 500;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .topbar {
      background: var(--brand);
      color: #ffffff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .brand-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      padding: 4px 0;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-pill {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      border-radius: 999px;
      min-height: 36px;
      padding: 6px 12px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .top-pill:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    .content {
      flex: 1;
      padding: 16px 16px 96px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hero {
      background: linear-gradient(150deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #ffffff;
      border-radius: var(--radius);
      padding: 20px 18px;
      box-shadow: var(--shadow-md);
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #fde68a;
      margin-bottom: 8px;
    }

    .hero h1 {
      color: #ffffff;
      font-size: 1.32rem;
      line-height: 1.28;
      margin: 0;
    }

    .hero p {
      color: #d6e6ed;
      font-size: 0.9rem;
      margin-top: 8px;
    }

    h1 {
      font-size: 1.35rem;
      line-height: 1.26;
      margin: 0;
      color: var(--text);
    }

    h2 {
      font-size: 1.08rem;
      line-height: 1.3;
      margin: 0;
      color: var(--text);
    }

    h3 {
      font-size: 0.96rem;
      margin: 0 0 4px;
      color: var(--text);
    }

    p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.93rem;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .card-soft {
      background: var(--surface-soft);
      border: 1px solid var(--border);
    }

    .card-amber {
      background: var(--accent-bg);
      border: 1.5px solid var(--accent-border);
    }

    .card-risk {
      background: var(--risk-bg);
      border: 1.5px solid var(--risk-border);
    }

    .card-neutral {
      background: var(--neutral-bg);
      border: 1.5px solid var(--neutral-border);
    }

    .action-card {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 15px 14px;
      display: flex;
      align-items: center;
      gap: 13px;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.08s ease, border-color 0.15s ease;
    }

    .action-card:active {
      transform: scale(0.985);
    }

    .action-card.primary-tone {
      border-color: #bfd6e0;
      background: #ffffff;
    }

    .action-card.amber-tone {
      border: 2px solid #d49b38;
      background: linear-gradient(180deg, #fffdf7 0%, #fff6e3 100%);
      box-shadow: 0 6px 18px rgba(180, 83, 9, 0.12);
      padding: 18px 16px;
    }

    .priority-badge {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--accent);
      background: #fdecc8;
      border: 1px solid #ecc67c;
      border-radius: 999px;
      padding: 2px 9px;
      margin-bottom: 5px;
    }

    .action-card.risk-tone {
      border-color: var(--risk-border);
      background: var(--risk-bg);
    }

    .icon-badge {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-brand {
      background: var(--brand-soft);
      color: var(--brand);
    }

    .icon-amber {
      background: #fde7bd;
      color: var(--accent);
    }

    .icon-risk {
      background: #fbdada;
      color: var(--risk);
    }

    .action-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text);
      display: block;
    }

    .action-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      display: block;
      margin-top: 3px;
      line-height: 1.38;
    }

    .tools-panel {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tile-btn {
      background: var(--surface);
      border: 1px solid #e4e9ee;
      border-radius: var(--radius-sm);
      padding: 13px 12px;
      min-height: 76px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      text-align: left;
      cursor: pointer;
    }

    .tile-btn:hover {
      border-color: #bfd6e0;
    }

    .tile-btn:active {
      transform: scale(0.985);
    }

    .tile-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
    }

    .tile-sub {
      font-size: 0.83rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      line-height: 1.35;
    }

    .btn-primary {
      background: var(--brand);
      color: #ffffff;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
    }

    .btn-risk {
      background: var(--risk-bg);
      color: var(--risk);
      border: 1.5px solid var(--risk-border);
    }

    .btn-ghost {
      background: transparent;
      color: var(--brand);
      padding: 4px 0;
      font-size: 0.9rem;
      font-weight: 700;
      width: auto;
      justify-content: flex-start;
    }

    .btn-center {
      justify-content: center;
      text-align: center;
    }

    .section-label {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .pill {
      display: inline-block;
      font-size: 0.73rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .pill-brand { background: var(--brand-soft); color: var(--brand); }
    .pill-amber { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }
    .pill-risk { background: var(--risk-bg); color: var(--risk); border: 1px solid var(--risk-border); }
    .pill-neutral { background: var(--neutral-bg); color: var(--text); border: 1px solid var(--neutral-border); }
    .pill-fictional { background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; }

    .field-label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    textarea, input[type="text"] {
      width: 100%;
      font-family: inherit;
      font-size: 0.94rem;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      resize: vertical;
    }

    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--brand);
    }

    .quote-box {
      background: var(--surface-soft);
      border-left: 4px solid var(--brand);
      padding: 12px 14px;
      border-radius: 0 12px 12px 0;
      font-size: 0.92rem;
      color: var(--text);
    }

    .rr-block {
      border-top: 1px solid var(--border);
      padding-top: 11px;
      margin-top: 11px;
    }

    .rr-title {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--brand);
      margin-bottom: 4px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 14px;
      cursor: pointer;
      user-select: none;
    }

    .check-item.selected {
      border-color: var(--brand);
      background: var(--brand-soft);
    }

    .check-box {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 6px;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.82rem;
      color: #fff;
      background: #fff;
    }

    .check-item.selected .check-box {
      background: var(--brand);
      border-color: var(--brand);
    }

    .timer-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--brand-soft);
      border: 1px solid #bfd6e0;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }

    .timer-count {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--brand);
      min-width: 44px;
      text-align: center;
    }

    .list-clean {
      margin: 6px 0 0;
      padding-left: 18px;
      color: var(--text-muted);
      font-size: 0.91rem;
    }

    .list-clean li {
      margin-bottom: 6px;
    }

    .review-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #6b4e16;
      background: #fef8e7;
      border: 1px solid #ead39c;
      border-radius: 6px;
      padding: 3px 8px;
      margin-top: 8px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      z-index: 30;
    }

    .nav-item {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 2px;
      min-height: 48px;
    }

    .nav-item.active {
      color: var(--brand);
    }

    .secondary-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 720px) {
      body {
        padding: 24px 16px;
        align-items: flex-start;
      }

      .app-shell {
        max-width: 680px;
        min-height: calc(100vh - 48px);
        border-radius: 22px;
        overflow: hidden;
      }

      .content {
        padding: 22px 24px 104px;
        gap: 16px;
      }

      .secondary-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .bottom-nav {
        max-width: 680px;
        border-radius: 0 0 22px 22px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" role="application" aria-label="BREQUE Copiloto contra golpes">
    <div class="proto-strip">
      Protótipo PWA • Conteúdo fictício • Sem conexão com bancos ou apps reais
    </div>

    <header class="topbar">
      <button class="brand-btn" onclick="goHome()" aria-label="Voltar ao início do BREQUE">
        <svg width="24" height="24" viewBox="0 0 512 512" aria-hidden="true">
          <path d="M256 64L104 128v122c0 106 64 198 152 232 88-34 152-126 152-232V128L256 64z" fill="#1b536b" stroke="#ffffff" stroke-width="26" stroke-linejoin="round"/>
          <rect x="198" y="184" width="40" height="144" rx="14" fill="#f59e0b"/>
          <rect x="274" y="184" width="40" height="144" rx="14" fill="#f59e0b"/>
        </svg>
        BREQUE
      </button>
      <div class="top-actions">
        <button class="top-pill" onclick="changeFont(-0.1)" aria-label="Diminuir fonte">A-</button>
        <button class="top-pill" onclick="changeFont(0.1)" aria-label="Aumentar fonte">A+</button>
        <button class="top-pill" id="install-btn" onclick="handleInstallClick()">Instalar</button>
      </div>
    </header>

    <main id="app" class="content"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button class="nav-item" id="nav-home" onclick="goHome()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
        Início
      </button>
      <button class="nav-item" id="nav-verify" onclick="navigate('verify_start')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        Verificar
      </button>
      <button class="nav-item" id="nav-canais" onclick="navigate('discagem_segura')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.58 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Canais
      </button>
      <button class="nav-item" id="nav-privacy" onclick="navigate('privacy')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Dados
      </button>
    </nav>
  </div>

  <script>
    let deferredInstallPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }

      q2Pressure: null,

    const ROTEIRO_REVERSO = {

      2: {

        titulo: "Está conversando com a pessoa ou organização",

      },
      3: {

        titulo: "Está sob pressão para enviar dinheiro, código, documento ou instalar algo",
        acolhimento: "Pressa e pressão deixam qualquer pessoa tensa. Vamos desacelerar agora.",
        acaoAgora: "Interrompa o contato imediatamente e não envie código, senha, dinheiro, documento nem instale aplicativos.",

    function clearTimer() {
      if (state.pauseInterval) {
        clearInterval(state.pauseInterval);
        state.pauseInterval = null;
      }
      state.pauseSeconds = 0;
      stopCalmGuidance();
    }

    function stopCalmGuidance() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      state.isSpeaking = false;
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    function toggleCalmGuidance() {
      if (!("speechSynthesis" in window)) return;
      if (state.isSpeaking) {
        stopCalmGuidance();
        render();
        return;
      }

      const synth = window.speechSynthesis;
      synth.cancel();
      synth.resume();

      const text =
        "Respira fundo. Você não precisa fazer nada agora. Não informe códigos, senhas ou dados bancários. Você pode desligar a ligação agora mesmo. Quem é do banco ou da sua família de verdade vai entender e esperar.";
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "pt-BR";
      utter.rate = 0.88;
      utter.pitch = 0.98;
      utter.volume = 1;

      const voices = synth.getVoices();
      const ptVoice =
        voices.find(v => /pt[-_]BR/i.test(v.lang) && /natural|google|luciana|francisca|maria|antonio/i.test(v.name)) ||
        voices.find(v => /pt[-_]BR/i.test(v.lang)) ||
        voices.find(v => /^pt/i.test(v.lang));
      if (ptVoice) utter.voice = ptVoice;

      utter.onend = () => { state.isSpeaking = false; render(); };
      utter.onerror = () => { state.isSpeaking = false; render(); };

      window.__brequeUtter = utter;
      state.isSpeaking = true;
      render();

      setTimeout(() => {
        synth.resume();
        synth.speak(utter);
      }, 80);
    }

    function changeFont(delta) {
      state.fontScale = Math.min(1.25, Math.max(0.9, +(state.fontScale + delta).toFixed(2)));
      document.documentElement.style.setProperty("--font-scale", state.fontScale);
    }

    async function handleInstallClick() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
      } else {
        navigate("install_guide");
      }
    }

    function navigate(screen, pushHistory = true) {
      clearTimer();
      if (pushHistory && state.screen !== screen) state.history.push(state.screen);
      state.screen = screen;
      render();
    }

    function goBack() {
      clearTimer();
      state.screen = state.history.pop() || "home";
      render();
    }

    function goHome() {
      clearTimer();
      state.history = [];
      state.screen = "home";
      render();
    }

    function startPauseTimer() {
      clearTimer();
      state.pauseSeconds = 10;
      render();
      state.pauseInterval = setInterval(() => {
        state.pauseSeconds -= 1;
        if (state.pauseSeconds <= 0) clearTimer();
        render();
      }, 1000);
    }

    function selectFictionalExample(key) {
      const ex = FICTIONAL_EXAMPLES[key];
      state.verifyText = ex.text;

    function evaluateVerify() {
      const reasons = [];
      let score = 0;
      if (state.q1Origin === "banco") { reasons.push("O contato diz ser de banco, loja ou empresa."); score += 1; }
      else if (state.q1Origin === "familiar_novo") { reasons.push("Alguém conhecido entrou em contato por um número novo."); score += 1; }
      else if (state.q1Origin === "desconhecido") { reasons.push("O contato veio de um número ou remetente desconhecido."); score += 1; }

      if (state.q2Pressure === "sim") { reasons.push("Há pressão para agir rápido ou manter segredo."); score += 2; }
      if (state.q3Request === "dinheiro") { reasons.push("Houve pedido de dinheiro, Pix ou pagamento."); score += 2; }
      else if (state.q3Request === "credencial") { reasons.push("Houve pedido de código, senha, documento ou instalação de aplicativo."); score += 3; }

      if (score >= 3 || state.q3Request === "credencial") {
        return { status: "Sinais de risco", cardClass: "card-risk", pillClass: "pill-risk", stage: state.q2Pressure === "sim" ? 3 : 1, reasons };
      }
      if (score >= 1) {
        return { status: "Não dá para confirmar", cardClass: "card-amber", pillClass: "pill-amber", stage: 1, reasons };
      }
      return {
        status: "Poucos sinais encontrados — ainda vale verificar",
        cardClass: "card-neutral",
        pillClass: "pill-neutral",
        stage: 1,
        reasons: ["Nenhum dos sinais mais comuns foi marcado, mas isso não comprova que o contato seja legítimo."]
      };
    }

          <div><span class="pill pill-brand">Pergunta 3 de 3</span><h1>Pediram dinheiro, código, senha ou instalação de aplicativo?</h1></div>
          <div class="stack">
            <button class="btn ${state.q3Request === 'dinheiro' ? 'btn-primary' : 'btn-secondary'}" onclick="state.q3Request='dinheiro'; navigate('verify_result')">Sim, pediram dinheiro, Pix ou pagamento <span>→</span></button>
            <button class="btn ${state.q3Request === 'credencial' ? 'btn-primary' : 'btn-secondary'}" onclick="state.q3Request='credencial'; navigate('verify_result')">Sim, pediram código, senha, documento ou instalar app <span>→</span></button>
            <button class="btn ${state.q3Request === 'nenhum' ? 'btn-primary' : 'btn-secondary'}" onclick="state.q3Request='nenhum'; navigate('verify_result')">Não pediram nada disso <span>→</span></button>
          </div>
        `;
        return;
      }

      if (state.screen === "verify_result") {
        const res = evaluateVerify();
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar e ajustar respostas</button>
          <div class="card ${res.cardClass}">
            <span class="pill ${res.pillClass}">${res.status}</span>
            <h2>Leitura baseada nas 3 respostas marcadas</h2>
            <ul class="list-clean" style="color: var(--text);">${res.reasons.map(r => `<li>${r}</li>`).join("")}</ul>
            <p style="font-size: 0.8rem; margin-top: 8px;">O texto digitado não foi analisado automaticamente neste protótipo.</p>
          </div>
          ${renderRoteiroCard(res.stage)}
          <div class="stack">
            <button class="btn btn-primary btn-center" onclick="openHelpPreview('verificação de contato recebido')">Pedir ajuda a uma pessoa de confiança</button>
            <button class="btn btn-secondary btn-center" onclick="goHome()">Voltar ao início</button>
          </div>
        `;
        return;
      }

      if (state.screen === "pressure_pause") {
        const pauseHtml = state.pauseSeconds > 0
          ? `<div class="timer-box"><div><strong>Respire fundo</strong><p style="font-size:0.84rem;">Nenhuma decisão séria precisa ser tomada em segundos.</p></div><div class="timer-count">${state.pauseSeconds}s</div></div>`
          : `<button class="btn btn-secondary btn-center" onclick="startPauseTimer()">Fazer uma pausa de 10 segundos (opcional)</button>`;
        const audioBtn = "speechSynthesis" in window
          ? `<button class="btn ${state.isSpeaking ? 'btn-primary' : 'btn-secondary'} btn-center" onclick="toggleCalmGuidance()">${state.isSpeaking ? 'Parar áudio de orientação' : 'Ouvir orientação calma (voz do aparelho)'}</button>`
          : "";
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div class="card card-amber">
            <span class="pill pill-amber">Sessão de Proteção • Primeiro passo</span>
            <h1>Pause. Não informe códigos, senhas ou dados bancários.</h1>
            <p style="margin-top: 8px; color: var(--text);">Você não precisa resolver isso correndo. Quem é legítimo espera você confirmar.</p>
          </div>

          ${audioBtn}
          ${pauseHtml}

          <div class="card stack">
            <h3>Frases prontas para desligar sem constrangimento</h3>
            <div class="quote-box">“Meu celular está acabando a bateria. Vou ligar para o número do verso do meu cartão.”</div>
            <div class="quote-box">“Vou conferir isso com a minha família e já retorno.”</div>
            <p style="font-size: 0.82rem;">Se for familiar em número novo, faça a <strong>Pergunta Secreta da Família</strong> antes de fazer qualquer transferência.</p>
          </div>

          <button class="btn btn-primary btn-center" onclick="navigate('pressure_topic')">Continuar com calma →</button>
        `;
        return;
      }

      if (state.screen === "pressure_topic") {
        const topics = [
          { id: "dinheiro", label: "Pedido de dinheiro ou Pix" },
          { id: "banco", label: "Contato que diz ser do banco" },
          { id: "familiar", label: "Familiar pedindo ajuda" },
          { id: "ameaca", label: "Ameaça ou intimidação" },
          { id: "investimento", label: "Promessa de investimento ou ganho rápido" },
          { id: "suporte", label: "Suporte técnico pedindo acesso ao aparelho" },
          { id: "outro", label: "Outra situação" }
        ];
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div><span class="pill pill-amber">Sessão de Proteção</span><h1>O que está acontecendo?</h1></div>
          <div class="stack">${topics.map(t => `<button class="btn btn-secondary" onclick="state.pressureTopic='${t.id}'; navigate('pressure_guide')">${t.label} <span>→</span></button>`).join("")}</div>
        `;
        return;
      }

      if (state.screen === "pressure_guide") {
        const extra = state.pressureTopic === "ameaca"
          ? "<strong>Atenção à sua segurança física:</strong> se você estiver sob ameaça imediata ou em risco físico, procure ajuda local apropriada imediatamente (como a polícia pelo 190)."
          : "";
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          ${renderRoteiroCard(3, extra)}
          <div class="stack">
            <button class="btn btn-primary btn-center" onclick="openHelpPreview('pressão acontecendo agora')">Pedir ajuda a uma pessoa de confiança</button>
            <button class="btn btn-risk btn-center" onclick="navigate('post_start')">Já passei dados ou fiz um pagamento</button>
            <button class="btn btn-secondary btn-center" onclick="goHome()">Voltar ao início</button>
          </div>
        `;
        return;
      }

      if (state.screen === "post_start") {
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div class="card card-soft">
            <span class="pill pill-risk">Mesa de Recuperação</span>
            <h1>Sem julgamento. Vamos cuidar de um passo por vez.</h1>
            <p style="margin-top: 6px;">O que chegou a acontecer?</p>
          </div>
          <div class="stack">
            <button class="btn btn-risk" onclick="state.postEvent='pix'; state.postChecked=new Set(); navigate('post_plan')">Fiz Pix ou pagamento <span>→</span></button>
            <button class="btn btn-risk" onclick="state.postEvent='credencial'; state.postChecked=new Set(); navigate('post_plan')">Compartilhei código ou senha <span>→</span></button>
            <button class="btn btn-risk" onclick="state.postEvent='app'; state.postChecked=new Set(); navigate('post_plan')">Instalei aplicativo ou dei acesso ao aparelho <span>→</span></button>
            <button class="btn btn-secondary" onclick="state.postEvent='documento'; state.postChecked=new Set(); navigate('post_plan')">Enviei documento ou foto <span>→</span></button>
            <button class="btn btn-secondary" onclick="state.postEvent='outro'; state.postChecked=new Set(); navigate('post_plan')">Outra situação / quero organizar o relato <span>→</span></button>
          </div>
        `;
        return;
      }

      if (state.screen === "post_plan") {
        const stageMap = { pix: 5, credencial: 4, app: 4, documento: 4, outro: 6 };
        const stepsMap = {
          pix: [
            "Contate imediatamente o seu banco pelo canal oficial (app já instalado ou verso do cartão) e pergunte sobre contestação/MED — sem garantia de bloqueio ou devolução.",
            "Guarde o comprovante, a chave usada e prints da conversa.",
            "Organize o relato e avalie registrar ocorrência na Delegacia Virtual oficial do seu estado."
          ],
          credencial: [
            "Acesse o serviço oficial por um canal confiável e troque a senha imediatamente.",
            "Troque a mesma senha em outros serviços onde ela for usada.",
            "Avise o banco ou serviço oficial caso note acessos desconhecidos."
          ],
          app: [
            "Interrompa imediatamente o contato com quem pediu a instalação.",
            "Evite abrir bancos neste aparelho até buscar suporte confiável.",
            "Se possível, troque senhas importantes a partir de outro aparelho confiável."
          ],
          documento: [
            "Interrompa o contato e não envie novos documentos ou selfies.",
            "Guarde prints e anote quais documentos foram enviados.",
            "Acompanhe contas e chaves no seu CPF pelo Registrato oficial do Banco Central."
          ],
          outro: [
            "Anote horário e o que aconteceu enquanto está recente.",
            "Guarde mensagens, números e comprovantes.",
            "Converse com uma pessoa de confiança para decidir o próximo passo."
          ]
        };
        const steps = stepsMap[state.postEvent] || stepsMap.outro;
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          ${renderRoteiroCard(stageMap[state.postEvent] || 6)}
          <div class="section-label">Próximos passos priorizados</div>
          <div class="stack">
            ${steps.map((txt, idx) => {
              const checked = state.postChecked.has(idx);
              return `<div class="check-item ${checked ? "selected" : ""}" onclick="togglePostCheck(${idx})"><div class="check-box">${checked ? "✓" : ""}</div><div style="font-size:0.92rem; ${checked ? "text-decoration:line-through; opacity:0.75;" : ""}">${txt}</div></div>`;
            }).join("")}
          </div>
          <div class="stack">
            <button class="btn btn-primary btn-center" onclick="openIncidentLog()">Organizar registro do incidente →</button>
            <button class="btn btn-secondary btn-center" onclick="openHelpPreview('apoio após incidente')">Pedir ajuda a uma pessoa de confiança</button>
          </div>
        `;
        return;
      }

      if (state.screen === "incident_log") {
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div>
            <span class="pill pill-fictional">Registro organizado • Apenas nesta sessão</span>
            <h1>Registro do Incidente</h1>
            <p style="margin-top: 6px;">Ajuda a organizar horários, relato e ações tomadas para falar com o banco ou buscar apoio, mas <strong>não é prova jurídica garantida</strong>.</p>
          </div>
          <div class="card stack">
            <div><label class="field-label" for="log-time">Horário aproximado</label><input id="log-time" type="text" value="${state.incidentLog.time}" oninput="state.incidentLog.time=this.value" /></div>
            <div><label class="field-label" for="log-summary">Seu relato</label><textarea id="log-summary" rows="4" placeholder="Anote o que aconteceu e o que você já fez..." oninput="state.incidentLog.summary=this.value">${state.incidentLog.summary}</textarea></div>
            <button class="btn btn-primary btn-center" onclick="state.incidentLog.saved=true; render();">Organizar resumo nesta tela (não fica salvo ao fechar)</button>
            ${state.incidentLog.saved ? `<div class="quote-box"><strong>Resumo organizado nesta sessão.</strong><br/>Horário: ${state.incidentLog.time || "Não informado"}<br/>Ações marcadas: ${state.postChecked.size}<br/><em>Ao fechar a página, estes dados somem.</em></div>` : ""}
          </div>
          <button class="btn btn-secondary btn-center" onclick="goHome()">Voltar ao início</button>
        `;
        return;
      }

      if (state.screen === "discagem_segura") {
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div>
            <span class="pill pill-brand">Discagem Segura • Canais oficiais</span>
            <h1>Fale com canais oficiais por conta própria</h1>
            <p style="margin-top: 6px;">Nunca retorne para o número suspeito nem use o telefone enviado na mensagem recebida.</p>
          </div>
          <div class="card stack"><h3>Seu banco (contestação e MED)</h3><p>Abra o aplicativo oficial já instalado ou ligue para o telefone impresso no verso do cartão.</p><p style="font-size:0.8rem;"><strong>Fonte:</strong> Banco Central do Brasil (MED) • <strong>Verificado em:</strong> 2026-11-21</p></div>
          <div class="card stack"><h3>Emergência policial (190)</h3><p>Disque 190 diretamente no discador do celular em caso de risco físico ou ameaça imediata.</p><p style="font-size:0.8rem;"><strong>Fonte:</strong> Serviço público de emergência policial • <strong>Verificado em:</strong> 2026-11-21</p></div>
          <div class="card stack"><h3>Delegacia Virtual / Polícia Civil</h3><p>Digite manualmente o portal oficial do seu estado (domínio .gov.br) ou procure delegacia presencial.</p><p style="font-size:0.8rem;"><strong>Fonte:</strong> MJSP / Polícias Civis estaduais • <strong>Verificado em:</strong> 2026-11-21</p></div>
          <div class="card stack"><h3>Registrato (Banco Central)</h3><p>Acesse manualmente bcb.gov.br com sua conta Gov.br para conferir contas, chaves Pix e empréstimos no seu CPF.</p><p style="font-size:0.8rem;"><strong>Fonte:</strong> Banco Central do Brasil • <strong>Verificado em:</strong> 2026-11-21</p></div>
        `;
        return;
      }

      if (state.screen === "trusted") {
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div>
            <span class="pill pill-fictional">Demonstração visual</span>
            <h1>Pessoa de Confiança</h1>
            <p style="margin-top: 6px;">Você decide quando pedir ajuda e revisa exatamente o texto antes de confirmar. O BREQUE <strong>não</strong> monitora ninguém nem envia alertas silenciosos.</p>
          </div>
          <div class="stack">
            ${state.trustedContacts.map(c => `<div class="card card-soft" style="display:flex; justify-content:space-between; align-items:center; gap:10px;"><div><div style="font-weight:700;">${c.name}</div><div style="font-size:0.82rem; color:var(--text-muted);">${c.note}</div></div><button class="btn btn-secondary" style="width:auto; padding:8px 12px; font-size:0.82rem;" onclick="state.selectedContactId='${c.id}'; openHelpPreview('pedido de apoio');">Ver prévia</button></div>`).join("")}
          </div>
          <div class="card stack">
            <h3>Adicionar contato (demonstração)</h3>
            <input type="text" placeholder="Nome (ex.: João - filho)" value="${state.newContactName}" oninput="state.newContactName=this.value" />
            <input type="text" placeholder="Relação (opcional)" value="${state.newContactNote}" oninput="state.newContactNote=this.value" />
            <button class="btn btn-primary btn-center" onclick="addTrustedContact()">Adicionar contato fictício</button>
          </div>
        `;
        return;
      }

      if (state.screen === "help_preview") {
        const contact = state.trustedContacts.find(c => c.id === state.selectedContactId) || state.trustedContacts[0];
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div>
            <span class="pill pill-brand">Prévia antes de confirmar</span>
            <h1>Pedido de ajuda para ${contact.name}</h1>
            <p style="margin-top: 6px;">Este protótipo não envia mensagens reais. Em versão futura, você escolheria por qual app enviar.</p>
          </div>
          <div class="card stack">
            <label class="field-label" for="help-msg">Conteúdo que seria compartilhado</label>
            <textarea id="help-msg" rows="4" oninput="state.helpPreviewText=this.value">${state.helpPreviewText}</textarea>
            ${!state.helpSentSimulated
              ? `<button class="btn btn-primary btn-center" onclick="state.helpSentSimulated=true; render();">Testar prévia (nenhuma mensagem será enviada)</button>`
              : `<div class="quote-box"><strong>Simulação concluída no protótipo.</strong><br/>Nenhuma mensagem real foi enviada e ${contact.name} não recebeu este aviso.</div>`}
          </div>
          <button class="btn btn-secondary btn-center" onclick="goHome()">Voltar ao início</button>
        `;
        return;
      }

      if (state.screen === "stages_overview") {
        const tabs = [1, 2, 3, 4, 5, 6].map(n => `<button class="top-pill" style="flex:1; background:${state.activeStage === n ? 'var(--brand)' : 'var(--surface)'}; color:${state.activeStage === n ? '#fff' : 'var(--text)'}; border-color:var(--border);" onclick="state.activeStage=${n}; render();">${n}</button>`).join("");
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div><h1>Roteiro Reverso (6 estágios)</h1><p style="margin-top:4px;">Toque em um estágio para ver a ação curta e segura recomendada.</p></div>
          <div style="display:flex; gap:6px;">${tabs}</div>
          ${renderRoteiroCard(state.activeStage)}
          <div class="card card-soft">
            <h3>Os 6 padrões de coerção</h3>
            <p>Nem todo golpe se reduz a estes padrões, mas eles costumam aparecer combinados:</p>
            <ul class="list-clean">
              <li><strong>Urgência</strong> • <strong>Sigilo</strong> • <strong>Falsa autoridade</strong></li>
              <li><strong>Medo de perda</strong> • <strong>Ganho inesperado</strong> • <strong>Vínculo afetivo</strong></li>
            </ul>
          </div>
        `;
        return;
      }

      if (state.screen === "privacy") {
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div><h1>Como o BREQUE usa seus dados</h1><p style="margin-top:6px;">Privacidade por padrão e transparência sobre o que o app não faz.</p></div>
          <div class="card">
            <h3>Neste protótipo PWA</h3>
            <ul class="list-clean">
              <li>Tudo roda localmente no seu aparelho; nenhum dado é enviado a servidores.</li>
              <li>Ao fechar ou recarregar a página, os relatos digitados desaparecem.</li>
            </ul>
          </div>
          <div class="card card-soft">
            <h3>O que o BREQUE NÃO faz</h3>
            <ul class="list-clean">
              <li>Não lê WhatsApp, SMS, e-mails nem notificações.</li>
              <li>Não escuta ligações nem monitora sua tela.</li>
              <li>Não acessa contas bancárias, saldos ou transações Pix.</li>
              <li>Não monitora familiares nem envia alertas silenciosos.</li>
              <li>Nunca exibe selo verde dizendo que algo “está seguro”.</li>
            </ul>
          </div>
          <button class="btn btn-primary btn-center" onclick="handleInstallClick()">Como instalar no celular (PWA)</button>
        `;
      }
    }

    render();
  </script>
</body>
</html>
