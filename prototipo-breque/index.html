<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2f3d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BREQUE" />
  <meta name="description" content="BREQUE — Copiloto contra golpes. Interrompa decisões sob pressão, verifique por outro canal e aja com calma." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="BREQUE" />
  <meta property="og:title" content="BREQUE — Copiloto contra golpes" />
  <meta property="og:description" content="Um breque na hora da dúvida. Interrompa decisões sob pressão, verifique por outro canal e aja com calma. Tudo processado no seu aparelho." />
  <meta property="og:url" content="https://breca-rho.vercel.app/" />
  <meta property="og:image" content="https://breca-rho.vercel.app/icon.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="BREQUE — Copiloto contra golpes" />
  <meta name="twitter:description" content="Um breque na hora da dúvida. Interrompa decisões sob pressão e verifique por outro canal." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>BREQUE — Copiloto contra golpes</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafb;
      --text: #0f1b24;
      --text-muted: #4b5c6b;
      --brand: #0f2f3d;
      --brand-2: #17465a;
      --brand-soft: #e6f0f4;
      --accent: #b45309;
      --accent-bg: #fff8eb;
      --accent-border: #f3d092;
      --risk: #991b1b;
      --risk-bg: #fef2f2;
      --risk-border: #f2bcbc;
      --neutral-bg: #eef2f5;
      --neutral-border: #cfd8e0;
      --border: #e1e7ec;
      --radius: 18px;
      --radius-sm: 13px;
      --shadow-sm: 0 2px 10px rgba(15, 27, 36, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 47, 61, 0.12);
      --font-scale: 1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: calc(16px * var(--font-scale));
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.48;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .proto-strip {
      background: #0b222c;
      color: #e2eff5;
      font-size: 0.8rem;
      line-height: 1.35;
      text-align: center;
      padding: 8px 14px;
      font-weight: 500;
    }

    .topbar {
      background: var(--brand);
      color: #ffffff;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 10px rgba(15, 47, 61, 0.15);
    }

    .brand-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      padding: 4px 0;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-pill {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      border-radius: 999px;
      min-height: 36px;
      padding: 6px 12px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .top-pill:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    .content {
      flex: 1;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 18px 16px 96px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hero {
      background: radial-gradient(circle at 85% 15%, rgba(14, 165, 198, 0.38) 0%, rgba(12, 46, 66, 0.92) 55%, #091d2b 100%);
      color: #ffffff;
      border-radius: var(--radius);
      border: 1px solid rgba(56, 189, 248, 0.28);
      padding: 22px 18px;
      box-shadow: var(--shadow-md);
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #fde68a;
      margin-bottom: 8px;
    }

    .hero h1 {
      color: #ffffff;
      font-size: 1.32rem;
      line-height: 1.28;
      margin: 0;
    }

    .hero p {
      color: #d6e6ed;
      font-size: 0.9rem;
      margin-top: 8px;
    }

    h1 {
      font-size: 1.35rem;
      line-height: 1.26;
      margin: 0;
      color: var(--text);
    }

    h2 {
      font-size: 1.08rem;
      line-height: 1.3;
      margin: 0;
      color: var(--text);
    }

    h3 {
      font-size: 0.96rem;
      margin: 0 0 4px;
      color: var(--text);
    }

    p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.93rem;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .card-soft {
      background: var(--surface-soft);
      border: 1px solid var(--border);
    }

    .card-amber {
      background: var(--accent-bg);
      border: 1.5px solid var(--accent-border);
    }

    .card-risk {
      background: var(--risk-bg);
      border: 1.5px solid var(--risk-border);
    }

    .card-neutral {
      background: var(--neutral-bg);
      border: 1.5px solid var(--neutral-border);
    }

    .action-card {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 15px 14px;
      display: flex;
      align-items: center;
      gap: 13px;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.08s ease, border-color 0.15s ease;
    }

    .action-card:active {
      transform: scale(0.985);
    }

    .action-card.primary-tone {
      border-color: rgba(56, 189, 248, 0.3);
      background: rgba(15, 39, 56, 0.88);
    }

    .action-card.amber-tone {
      border: 2px solid rgba(251, 191, 36, 0.72);
      background: linear-gradient(155deg, rgba(245, 158, 11, 0.2) 0%, rgba(15, 35, 50, 0.94) 100%);
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.16);
      padding: 18px 16px;
    }

    .priority-badge {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 800;
      color: #fde68a;
      background: rgba(245, 158, 11, 0.22);
      border: 1px solid rgba(251, 191, 36, 0.5);
      border-radius: 999px;
      padding: 2px 9px;
      margin-bottom: 5px;
    }

    .action-card.risk-tone {
      border-color: var(--risk-border);
      background: linear-gradient(155deg, rgba(220, 38, 38, 0.18) 0%, rgba(15, 31, 45, 0.94) 100%);
    }

    .icon-badge {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-brand {
      background: rgba(14, 165, 198, 0.2);
      color: #38bdf8;
    }

    .icon-amber {
      background: rgba(245, 158, 11, 0.22);
      color: #fbbf24;
    }

    .icon-risk {
      background: rgba(239, 68, 68, 0.22);
      color: #fca5a5;
    }

    .action-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text);
      display: block;
    }

    .action-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      display: block;
      margin-top: 3px;
      line-height: 1.38;
    }

    .tools-panel {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tile-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 12px;
      min-height: 76px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      text-align: left;
      cursor: pointer;
    }

    .tile-btn:hover {
      border-color: #bfd6e0;
    }

    .tile-btn:active {
      transform: scale(0.985);
    }

    .tile-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
    }

    .tile-sub {
      font-size: 0.83rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      line-height: 1.35;
    }

    .btn-primary {
      background: var(--brand);
      color: #ffffff;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
    }

    .btn-risk {
      background: var(--risk-bg);
      color: var(--risk);
      border: 1.5px solid var(--risk-border);
    }

    .btn-ghost {
      background: transparent;
      color: var(--brand);
      padding: 4px 0;
      font-size: 0.9rem;
      font-weight: 700;
      width: auto;
      justify-content: flex-start;
    }

    .btn-center {
      justify-content: center;
      text-align: center;
    }

    .section-label {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .pill {
      display: inline-block;
      font-size: 0.73rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .pill-brand { background: var(--brand-soft); color: var(--brand); }
    .pill-amber { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }
    .pill-risk { background: var(--risk-bg); color: var(--risk); border: 1px solid var(--risk-border); }
    .pill-neutral { background: var(--neutral-bg); color: var(--text); border: 1px solid var(--neutral-border); }
    .pill-fictional { background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; }

    .field-label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    textarea, input[type="text"] {
      width: 100%;
      font-family: inherit;
      font-size: 0.94rem;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      resize: vertical;
    }

    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--brand);
    }

    .quote-box {
      background: var(--surface-soft);
      border-left: 4px solid var(--brand);
      padding: 12px 14px;
      border-radius: 0 12px 12px 0;
      font-size: 0.92rem;
      color: var(--text);
    }

    .rr-block {
      border-top: 1px solid var(--border);
      padding-top: 11px;
      margin-top: 11px;
    }

    .rr-title {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--brand);
      margin-bottom: 4px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 14px;
      cursor: pointer;
      user-select: none;
    }

    .check-item.selected {
      border-color: var(--brand);
      background: var(--brand-soft);
    }

    .check-box {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 6px;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.82rem;
      color: #fff;
      background: #fff;
    }

    .check-item.selected .check-box {
      background: var(--brand);
      border-color: var(--brand);
    }

    .timer-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--brand-soft);
      border: 1px solid #bfd6e0;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }

    .timer-count {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--brand);
      min-width: 44px;
      text-align: center;
    }

    .list-clean {
      margin: 6px 0 0;
      padding-left: 18px;
      color: var(--text-muted);
      font-size: 0.91rem;
    }

    .list-clean li {
      margin-bottom: 6px;
    }

    .review-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #6b4e16;
      background: #fef8e7;
      border: 1px solid #ead39c;
      border-radius: 6px;
      padding: 3px 8px;
      margin-top: 8px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      z-index: 30;
    }

    .nav-item {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 2px;
      min-height: 48px;
    }

    .nav-item.active {
      color: var(--brand);
    }

    .secondary-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .welcome-screen {
      flex: 1;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      padding: 64px 28px 44px;
      background:
        radial-gradient(circle at 20% 12%, rgba(16, 185, 129, 0.34) 0%, transparent 48%),
        radial-gradient(circle at 82% 16%, rgba(14, 165, 233, 0.34) 0%, transparent 46%),
        radial-gradient(circle at 50% 92%, rgba(56, 189, 248, 0.55) 0%, rgba(7, 32, 52, 0.92) 48%, #040b11 100%);
    }

    .welcome-waves {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.9;
    }

    .welcome-center {
      position: relative;
      z-index: 2;
      margin-top: auto;
      margin-bottom: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 340px;
    }

    .welcome-shield {
      width: 78px;
      height: 78px;
      border-radius: 24px;
      background: rgba(10, 32, 46, 0.72);
      border: 1.5px solid rgba(186, 230, 253, 0.35);
      box-shadow: 0 0 36px rgba(56, 189, 248, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-title {
      font-size: 1.72rem;
      font-weight: 800;
      line-height: 1.22;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .welcome-sub {
      font-size: 0.96rem;
      line-height: 1.5;
      color: #cfe4f0;
      margin: 0;
    }

    .welcome-go {
      position: relative;
      z-index: 2;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      background: #040b11;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .welcome-go:hover {
      background: #0d2536;
      transform: scale(1.05);
    }

    .welcome-go:active {
      transform: scale(0.96);
    }

    .hidden-chrome {
      display: none !important;
    }

    .status-glass {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 14px;
      background: var(--brand-soft);
      border: 1px solid #c5dce5;
      color: var(--brand);
      font-size: 0.86rem;
      font-weight: 600;
    }

    .arc-hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 18px;
      border-radius: 22px;
      background: linear-gradient(150deg, #0f2f3d 0%, #17465a 100%);
      border: none;
      cursor: pointer;
      text-align: center;
      width: 100%;
      box-shadow: var(--shadow-md);
    }

    .arc-hero:active {
      transform: scale(0.99);
    }

    .arc-wrap {
      position: relative;
      width: 260px;
      height: 146px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 12px;
    }

    .arc-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.35));
    }

    .arc-label {
      position: relative;
      z-index: 2;
      font-size: 1.44rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #ffffff;
      line-height: 1.1;
    }

    .arc-sub {
      position: relative;
      z-index: 2;
      font-size: 0.82rem;
      color: #fde68a;
      font-weight: 700;
      margin-top: 5px;
    }

    .glass-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .glass-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 14px 12px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      min-height: 112px;
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    .glass-card.amber-glass {
      border-color: var(--accent-border);
      background: var(--accent-bg);
    }

    .glass-card.risk-glass {
      border-color: var(--risk-border);
      background: var(--risk-bg);
    }

    .glass-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .glass-mini-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--brand-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .glass-card-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
    }

    .glass-card-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.32;
    }

    .summary-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    .summary-row {
      width: 100%;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
    }

    .summary-row:hover {
      background: var(--brand-soft);
      border-color: #bfd6e0;
    }

    .summary-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .summary-icon {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      background: var(--brand-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand);
    }

    .summary-tag {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--brand);

        ["2. CONFIRME POR OUTRO CANAL", "Use o número antigo ou o telefone no verso do cartão."],
        ["3. NUNCA PASSE CÓDIGOS", "Banco não pede código de SMS, senha nem instalar app."]
      ];

      let y = 370;
      passos.forEach(([titulo, desc]) => {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(70, y, 940, 185);
        ctx.strokeStyle = "#d9e2e8";
        ctx.lineWidth = 3;
        ctx.strokeRect(70, y, 940, 185);

        ctx.fillStyle = "#0f2f3d";
        ctx.font = "bold 36px sans-serif";
        ctx.fillText(titulo, 110, y + 72);

        ctx.fillStyle = "#334155";
        ctx.font = "30px sans-serif";
        ctx.fillText(desc, 110, y + 132);
        y += 220;
      });

      // Bloco Pergunta Secreta
      ctx.fillStyle = "#fff8eb";
      ctx.fillRect(70, 1045, 940, 180);
      ctx.strokeStyle = "#d49b38";
      ctx.lineWidth = 4;
      ctx.strokeRect(70, 1045, 940, 180);

      ctx.fillStyle = "#92400e";
      ctx.font = "bold 34px sans-serif";
      ctx.fillText("LEMBRETE: PERGUNTA SECRETA DA FAMÍLIA", 110, 1110);

      ctx.fillStyle = "#1e293b";
      ctx.font = "28px sans-serif";
      const hint = state.cardFamilyHint.trim() || "Faça a pergunta que combinamos pessoalmente antes de fazer Pix.";

      const url = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = url;
      a.download = "cartao-familia-breque.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      state.cardDownloaded = true;
      render();
    }

    async function submitPlanInterest() {
      const email = state.planEmail.trim();
      if (!email || !email.includes("@")) {
        state.planStatus = "Digite um e-mail válido para continuar.";
        render();
        return;
      }
      state.planStatus = "enviando";
      render();
      try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/interesse_planos`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            Prefer: "return=minimal"
          },
          body: JSON.stringify({ email, plano: state.selectedPlan })
        });
        if (resp.ok) {
          state.planStatus = "ok";
          state.planEmail = "";
        } else {
          state.planStatus = "erro";
        }
      } catch {
        state.planStatus = "erro";
      }
      render();
    }

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "relato-breque.txt";

      a.click();
      document.body.removeChild(a);

      render();

    function clearTimer() {
      if (state.pauseInterval) {
        clearInterval(state.pauseInterval);
        state.pauseInterval = null;
      }
      state.pauseSeconds = 0;
      stopCalmGuidance();
    }

    function stopCalmGuidance() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      state.isSpeaking = false;
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    function toggleCalmGuidance() {
      if (!("speechSynthesis" in window)) return;
      if (state.isSpeaking) {
        stopCalmGuidance();
        render();
        return;
      }

      const synth = window.speechSynthesis;
      synth.cancel();
      synth.resume();

      const text =
        "Respira fundo. Você não precisa fazer nada agora. Não informe códigos, senhas ou dados bancários. Você pode desligar a ligação agora mesmo. Quem é do banco ou da sua família de verdade vai entender e esperar.";
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "pt-BR";
      utter.rate = 0.88;
      utter.pitch = 0.98;
      utter.volume = 1;

      const voices = synth.getVoices();
      const ptVoice =
        voices.find(v => /pt[-_]BR/i.test(v.lang) && /natural|google|luciana|francisca|maria|antonio/i.test(v.name)) ||
        voices.find(v => /pt[-_]BR/i.test(v.lang)) ||
        voices.find(v => /^pt/i.test(v.lang));
      if (ptVoice) utter.voice = ptVoice;

      utter.onend = () => { state.isSpeaking = false; render(); };
      utter.onerror = () => { state.isSpeaking = false; render(); };

      window.__brequeUtter = utter;
      state.isSpeaking = true;
      render();

      setTimeout(() => {
        synth.resume();
        synth.speak(utter);
      }, 80);
    }

    function changeFont(delta) {
      state.fontScale = Math.min(1.25, Math.max(0.9, +(state.fontScale + delta).toFixed(2)));
      document.documentElement.style.setProperty("--font-scale", state.fontScale);
    }

    async function handleInstallClick() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
      } else {
        navigate("install_guide");
      }
    }

    function navigate(screen, pushHistory = true) {
      clearTimer();
      if (pushHistory && state.screen !== screen) state.history.push(state.screen);
      state.screen = screen;
      render();
    }

    function goBack() {
      clearTimer();
      state.screen = state.history.pop() || "home";
      render();
    }

    function goHome() {
      clearTimer();
      state.history = [];
      state.screen = "home";
      render();
    }

    function startPauseTimer() {
      clearTimer();
      state.pauseSeconds = 10;
      render();
      state.pauseInterval = setInterval(() => {
        state.pauseSeconds -= 1;
        if (state.pauseSeconds <= 0) clearTimer();
        render();
      }, 1000);
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeText(str) {
      return (str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function analyzeLocalTextOrLink(raw) {
      const text = (raw || "").trim();
      if (!text) return null;
      const norm = normalizeText(text);
      const findings = [];
      let score = 0;

      // 1. Análise estrutural de link (sem acessar o site)
      const urlMatch = text.match(/(https?:\/\/[^\s]+|www\.[^\s]+|[a-z0-9-]+\.(com|net|org|xyz|top|site|online|click|vip|info|br)(\/[^\s]*)?)/i);
      if (urlMatch) {
        const rawUrl = urlMatch[0].toLowerCase();
        if (/^http:\/\//.test(rawUrl)) {
          findings.push("O link usa HTTP sem criptografia (não tem HTTPS).");
          score += 1;
        }
        if (/(bit\.ly|tinyurl\.com|t\.co|cutt\.ly|rb\.gy|shorturl)/i.test(rawUrl)) {
          findings.push("Link encurtado: esconde o endereço real do site de destino.");
          score += 2;
        }
        if (/\.(xyz|top|click|site|online|vip|info)\b/i.test(rawUrl)) {
          findings.push("Terminação de domínio muito usada em páginas temporárias de golpe.");
          score += 2;
        }
        if (/(gov|correios|receita|inss|itau|bradesco|santander|nubank|caixa|serasa|bb\.|mercadopago)/i.test(rawUrl) && !/\.gov\.br\b/i.test(rawUrl)) {
          findings.push("O link cita banco ou órgão conhecido fora de um domínio oficial verificado.");
          score += 3;
        }
        if (/\b\d{1,3}(\.\d{1,3}){3}\b/.test(rawUrl)) {
          findings.push("O link aponta para um número IP direto em vez de um site oficial.");
          score += 3;
        }
      }

      // 2. Análise dos 6 padrões de coerção + pedidos sensíveis
      const rules = [
        { name: "Urgência", pts: 2, re: /(urgente|agora|imediatamente|hoje ainda|ultima chance|em ate \d|prazo|rapido|retido|vai bloquear)/ },
        { name: "Sigilo", pts: 3, re: /(nao conta|nao fale|nao desligue|sigiloso|confidencial|entre nos|apaga essa)/ },
        { name: "Falsa autoridade", pts: 2, re: /(central de seguranca|central de atendimento|gerente|ouvidoria|advogado|precatorio|receita federal|inss|suporte tecnico)/ },
        { name: "Medo de perda", pts: 2, re: /(conta foi invadida|cartao foi clonado|compra suspeita|vao bloquear|emprestimo no seu nome|devolucao|negativado)/ },
        { name: "Ganho inesperado", pts: 2, re: /(voce foi sorteado|premio|valores a receber|resgate|indenizacao|restituicao|bonus)/ },
        { name: "Vínculo afetivo", pts: 2, re: /(troquei de numero|numero novo|numero provisorio|oi mae|oi pai|celular quebrou|depois te devolvo)/ },
        { name: "Pedido sensível", pts: 3, re: /(pix|boleto|taxa|transferencia|codigo|sms|senha|instalar|aplicativo|anydesk|teamviewer)/ }
      ];

      rules.forEach(r => {
        if (r.re.test(norm)) {
          findings.push(`Padrão identificado no texto: ${r.name}.`);
          score += r.pts;
        }
      });

      if (score >= 4) {
        return {
          status: "Sinais de risco",
          cardClass: "card-risk",
          pillClass: "pill-risk",
          stage: 3,
          findings
        };
      }
      if (score >= 1) {
        return {
          status: "Não dá para confirmar",
          cardClass: "card-amber",
          pillClass: "pill-amber",
          stage: 1,
          findings
        };
      }
      return {
        status: "Poucos sinais encontrados — ainda vale verificar",
        cardClass: "card-neutral",
        pillClass: "pill-neutral",
        stage: 1,
        findings: ["Nenhum dos padrões locais mais comuns apareceu no texto/link, mas isso não garante que seja legítimo."]
      };
    }

    function evaluateVerify() {
      const reasons = [];
      let score = 0;
      if (state.q1Origin === "banco") { reasons.push("O contato diz ser de banco, loja ou empresa."); score += 1; }
      else if (state.q1Origin === "familiar_novo") { reasons.push("Alguém conhecido entrou em contato por um número novo."); score += 1; }
      else if (state.q1Origin === "desconhecido") { reasons.push("O contato veio de um número ou remetente desconhecido."); score += 1; }

      if (state.q2Pressure === "sim") { reasons.push("Há pressão para agir rápido ou manter segredo."); score += 2; }
      if (state.q3Request === "dinheiro") { reasons.push("Houve pedido de dinheiro, Pix ou pagamento."); score += 2; }
      else if (state.q3Request === "credencial") { reasons.push("Houve pedido de código, senha, documento ou instalação de aplicativo."); score += 3; }

      if (score >= 3 || state.q3Request === "credencial") {
        return { status: "Sinais de risco", cardClass: "card-risk", pillClass: "pill-risk", stage: state.q2Pressure === "sim" ? 3 : 1, reasons };
      }
      if (score >= 1) {
        return { status: "Não dá para confirmar", cardClass: "card-amber", pillClass: "pill-amber", stage: 1, reasons };
      }
      return {
        status: "Poucos sinais encontrados — ainda vale verificar",
        cardClass: "card-neutral",
        pillClass: "pill-neutral",
        stage: 1,
        reasons: ["Nenhum dos sinais mais comuns foi marcado, mas isso não comprova que o contato seja legítimo."]
      };
    }

            "Guarde mensagens, números e comprovantes.",
            "Converse com uma pessoa de confiança para decidir o próximo passo."
          ]
        };
        const steps = stepsMap[state.postEvent] || stepsMap.outro;
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          ${renderRoteiroCard(stageMap[state.postEvent] || 6)}
          <div class="section-label">Próximos passos priorizados</div>
          <div class="stack">
            ${steps.map((txt, idx) => {
              const checked = state.postChecked.has(idx);
              return `<div class="check-item ${checked ? "selected" : ""}" onclick="togglePostCheck(${idx})"><div class="check-box">${checked ? "✓" : ""}</div><div style="font-size:0.92rem; ${checked ? "text-decoration:line-through; opacity:0.75;" : ""}">${txt}</div></div>`;
            }).join("")}
          </div>
          <div class="stack">
            <button class="btn btn-primary btn-center" onclick="openIncidentLog()">Organizar registro do incidente →</button>
            <button class="btn btn-secondary btn-center" onclick="openHelpPreview('apoio após incidente')">Pedir ajuda a uma pessoa de confiança</button>
          </div>
        `;
        return;
      }

      if (state.screen === "incident_log") {
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div>
            <span class="pill pill-brand">Registro local • 100% no seu aparelho</span>
            <h1>Registro do Incidente</h1>
            <p style="margin-top: 6px;">Ajuda a organizar horários, relato e ações tomadas para falar com o banco ou buscar apoio, mas <strong>não é prova jurídica garantida</strong>.</p>
          </div>
          <div class="card stack">
            <div><label class="field-label" for="log-time">Horário aproximado</label><input id="log-time" type="text" maxlength="40" value="${escapeHtml(state.incidentLog.time)}" oninput="state.incidentLog.time=this.value" /></div>
            <div><label class="field-label" for="log-summary">Seu relato</label><textarea id="log-summary" rows="4" maxlength="2000" placeholder="Anote o que aconteceu e o que você já fez..." oninput="state.incidentLog.summary=this.value">${escapeHtml(state.incidentLog.summary)}</textarea></div>
            <button class="btn btn-primary btn-center" onclick="exportIncidentTxt()">Confirmar e baixar relato-breque.txt no aparelho</button>
            ${state.incidentLog.saved ? `<div class="quote-box"><strong>Arquivo relato-breque.txt gerado localmente!</strong><br/>Nenhum dado foi enviado para servidores. Ao fechar o app, os campos desta tela são limpos.</div>` : ""}
          </div>
          <button class="btn btn-secondary btn-center" onclick="goHome()">Voltar ao início</button>
        `;
        return;
      }

      if (state.screen === "discagem_segura") {
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div>
            <span class="pill pill-brand">Discagem Segura • Canais oficiais</span>
            <h1>Fale com canais oficiais por conta própria</h1>
            <p style="margin-top: 6px;">Nunca retorne para o número suspeito nem use o telefone enviado na mensagem recebida.</p>
          </div>
          <div class="card stack"><h3>Seu banco (contestação e MED)</h3><p>Abra o aplicativo oficial já instalado ou ligue para o telefone impresso no verso do cartão.</p><p style="font-size:0.8rem;"><strong>Fonte:</strong> Banco Central do Brasil (MED) • <strong>Verificado em:</strong> 2026-11-21</p></div>
          <div class="card stack"><h3>Emergência policial (190)</h3><p>Disque 190 diretamente no discador do celular em caso de risco físico ou ameaça imediata.</p><p style="font-size:0.8rem;"><strong>Fonte:</strong> Serviço público de emergência policial • <strong>Verificado em:</strong> 2026-11-21</p></div>
          <div class="card stack"><h3>Delegacia Virtual / Polícia Civil</h3><p>Digite manualmente o portal oficial do seu estado (domínio .gov.br) ou procure delegacia presencial.</p><p style="font-size:0.8rem;"><strong>Fonte:</strong> MJSP / Polícias Civis estaduais • <strong>Verificado em:</strong> 2026-11-21</p></div>
          <div class="card stack"><h3>Registrato (Banco Central)</h3><p>Acesse manualmente bcb.gov.br com sua conta Gov.br para conferir contas, chaves Pix e empréstimos no seu CPF.</p><p style="font-size:0.8rem;"><strong>Fonte:</strong> Banco Central do Brasil • <strong>Verificado em:</strong> 2026-11-21</p></div>
        `;
        return;
      }

      if (state.screen === "trusted") {
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div>
            <span class="pill pill-fictional">Demonstração visual</span>
            <h1>Pessoa de Confiança</h1>
            <p style="margin-top: 6px;">Você decide quando pedir ajuda e revisa exatamente o texto antes de confirmar. O BREQUE <strong>não</strong> monitora ninguém nem envia alertas silenciosos.</p>
          </div>
          <div class="stack">
            ${state.trustedContacts.map(c => `<div class="card card-soft" style="display:flex; justify-content:space-between; align-items:center; gap:10px;"><div><div style="font-weight:700;">${escapeHtml(c.name)}</div><div style="font-size:0.82rem; color:var(--text-muted);">${escapeHtml(c.note)}</div></div><button class="btn btn-secondary" style="width:auto; padding:8px 12px; font-size:0.82rem;" onclick="state.selectedContactId='${escapeHtml(c.id)}'; openHelpPreview('pedido de apoio');">Ver prévia</button></div>`).join("")}
          </div>
          <div class="card stack">
            <h3>Adicionar contato (demonstração)</h3>
            <input type="text" maxlength="60" placeholder="Nome (ex.: João - filho)" value="${escapeHtml(state.newContactName)}" oninput="state.newContactName=this.value" />
            <input type="text" maxlength="80" placeholder="Relação (opcional)" value="${escapeHtml(state.newContactNote)}" oninput="state.newContactNote=this.value" />
            <button class="btn btn-primary btn-center" onclick="addTrustedContact()">Adicionar contato fictício</button>
          </div>
        `;
        return;
      }

      if (state.screen === "help_preview") {
        const contact = state.trustedContacts.find(c => c.id === state.selectedContactId) || state.trustedContacts[0];
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div>
            <span class="pill pill-brand">Prévia antes de compartilhar</span>
            <h1>Pedido de ajuda para ${escapeHtml(contact.name)}</h1>
            <p style="margin-top: 6px;">Revise o texto abaixo. O BREQUE não envia nada sozinho — ao confirmar, você abre o compartilhamento do seu celular ou copia o texto.</p>
          </div>
          <div class="card stack">
            <label class="field-label" for="help-msg">Conteúdo que será compartilhado</label>
            <textarea id="help-msg" rows="4" maxlength="1000" oninput="state.helpPreviewText=this.value">${escapeHtml(state.helpPreviewText)}</textarea>
            <button class="btn btn-primary btn-center" onclick="shareHelpRequest()">Confirmar e compartilhar / copiar texto</button>
            ${state.helpFeedback ? `<div class="quote-box">${state.helpFeedback}</div>` : ""}
          </div>
          <button class="btn btn-secondary btn-center" onclick="goHome()">Voltar ao início</button>
        `;
        return;
      }

      if (state.screen === "planos") {
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div>
            <span class="pill pill-brand">Planos BREQUE</span>
            <h1>Proteção acessível, sem vender seus dados</h1>
            <p style="margin-top: 6px;">O socorro essencial é gratuito. Os planos pagos ampliam o apoio para sua família e sustentam o projeto.</p>
          </div>

          <div class="card stack">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <h2>Básico</h2>
              <strong style="color:var(--brand); font-size:1.1rem;">Grátis</strong>
            </div>
            <ul class="list-clean">
              <li>Roteiro Reverso (6 estágios) e 6 padrões de coerção</li>
              <li>Sessão de Proteção com Áudio-Guia e frases de saída</li>
              <li>Discagem Segura (canais oficiais verificados)</li>
              <li>Código da Família e Mesa de Recuperação</li>
            </ul>
          </div>

          <div class="card card-amber stack">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <span class="priority-badge">Para famílias</span>
                <h2>Plus / Família</h2>
              </div>
              <div style="text-align:right;">
                <strong style="color:var(--text); font-size:1.15rem;">R$ 12,90/mês</strong>
                <div style="font-size:0.78rem; color:var(--text-muted);">ou R$ 99/ano (até 5 pessoas)</div>
              </div>
            </div>
            <ul class="list-clean" style="color:var(--text);">
              <li>Tudo do plano Básico para até 5 familiares</li>
              <li>Até 5 Pessoas de Confiança cadastradas</li>
              <li>Exportação completa do Registro do Incidente (.txt)</li>
              <li>Atualizações prioritárias de canais oficiais e golpes</li>
            </ul>
            <button class="btn btn-primary btn-center" onclick="state.selectedPlan='familia_mensal'; document.getElementById('plan-signup').scrollIntoView({behavior:'smooth'});">
              Escolher Família (R$ 12,90/mês)
            </button>
          </div>

          <div class="card stack">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <h2>Gold</h2>
              <div style="text-align:right;">
                <strong style="color:var(--text); font-size:1.1rem;">R$ 29,90/mês</strong>
                <div style="font-size:0.78rem; color:var(--text-muted);">em preparação com parceiros</div>
              </div>
            </div>
            <ul class="list-clean">
              <li>Tudo do plano Família</li>
              <li>Apoio guiado na Mesa de Recuperação</li>
              <li>Microsseguro digital via seguradora parceira (SUSEP)</li>
            </ul>
            <button class="btn btn-secondary btn-center" onclick="state.selectedPlan='gold'; document.getElementById('plan-signup').scrollIntoView({behavior:'smooth'});">
              Tenho interesse no Gold
            </button>
          </div>

          <div class="card card-soft stack">
            <h3>Cooperativas, bancos e empresas (B2B2C)</h3>
            <p>A partir de R$ 0,50 a R$ 1,50 por usuário ativo/mês para oferecer o BREQUE gratuitamente à sua base.</p>
            <button class="btn btn-secondary btn-center" onclick="state.selectedPlan='institucional'; document.getElementById('plan-signup').scrollIntoView({behavior:'smooth'});">
              Falar sobre plano institucional
            </button>
          </div>

          <div class="card stack" id="plan-signup">
            <h3>Reservar plano / entrar na lista prioritária</h3>
            <p style="font-size:0.84rem;">Ao confirmar, salvamos <strong>apenas seu e-mail e o plano escolhido</strong> no banco de dados (Supabase) para avisar assim que o pagamento for liberado.</p>
            <div>
              <label class="field-label" for="plan-select">Plano escolhido</label>
              <select id="plan-select" style="width:100%; padding:11px; border-radius:12px; border:1.5px solid var(--border); font-size:0.94rem; background:var(--surface-soft); color:var(--text);" onchange="state.selectedPlan=this.value">
                <option value="familia_mensal" ${state.selectedPlan === 'familia_mensal' ? 'selected' : ''}>Plus / Família — R$ 12,90/mês</option>
                <option value="familia_anual" ${state.selectedPlan === 'familia_anual' ? 'selected' : ''}>Plus / Família Anual — R$ 99,00/ano</option>
                <option value="gold" ${state.selectedPlan === 'gold' ? 'selected' : ''}>Gold — R$ 29,90/mês</option>
                <option value="institucional" ${state.selectedPlan === 'institucional' ? 'selected' : ''}>Cooperativa / Empresa (B2B2C)</option>
              </select>
            </div>
            <div>
              <label class="field-label" for="plan-email">Seu e-mail</label>
              <input id="plan-email" type="text" maxlength="254" placeholder="voce@exemplo.com" value="${escapeHtml(state.planEmail)}" oninput="state.planEmail=this.value" />
            </div>
            <button class="btn btn-primary btn-center" onclick="submitPlanInterest()">
              ${state.planStatus === 'enviando' ? 'Salvando...' : 'Confirmar interesse no plano'}
            </button>
            ${state.planStatus === 'ok' ? `<div class="quote-box"><strong>Interesse registrado no Supabase!</strong> Avisaremos você por e-mail assim que o checkout for liberado.</div>` : ""}
            ${state.planStatus === 'erro' ? `<div class="quote-box" style="border-left-color:var(--risk); background:var(--risk-bg);">Não foi possível gravar agora. Verifique se o <code>supabase/schema.sql</code> já foi executado no SQL Editor do Supabase.</div>` : ""}
            ${state.planStatus && !['enviando','ok','erro'].includes(state.planStatus) ? `<p style="color:var(--risk); font-size:0.86rem;">${state.planStatus}</p>` : ""}
          </div>
        `;
        return;
      }

      if (state.screen === "stages_overview") {
        const tabs = [1, 2, 3, 4, 5, 6].map(n => `<button class="top-pill" style="flex:1; background:${state.activeStage === n ? 'var(--brand)' : 'var(--surface)'}; color:${state.activeStage === n ? '#fff' : 'var(--text)'}; border-color:var(--border);" onclick="state.activeStage=${n}; render();">${n}</button>`).join("");
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div><h1>Roteiro Reverso (6 estágios)</h1><p style="margin-top:4px;">Toque em um estágio para ver a ação curta e segura recomendada.</p></div>
          <div style="display:flex; gap:6px;">${tabs}</div>
          ${renderRoteiroCard(state.activeStage)}
          <div class="card card-soft">
            <h3>Os 6 padrões de coerção</h3>
            <p>Nem todo golpe se reduz a estes padrões, mas eles costumam aparecer combinados:</p>
            <ul class="list-clean">
              <li><strong>Urgência</strong> • <strong>Sigilo</strong> • <strong>Falsa autoridade</strong></li>
              <li><strong>Medo de perda</strong> • <strong>Ganho inesperado</strong> • <strong>Vínculo afetivo</strong></li>
            </ul>
          </div>
        `;
        return;
      }

      if (state.screen === "privacy") {
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div>
            <span class="pill pill-brand">Transparência • Termos e LGPD</span>
            <h1>Termos de Uso, Privacidade e LGPD</h1>
            <p style="margin-top:6px;">Linguagem clara sobre o que o BREQUE faz, o que não promete e como seus dados são tratados.</p>
          </div>

          <div class="card card-amber stack">
            <h3>1. Termos de Uso e Limitação de Responsabilidade</h3>
            <ul class="list-clean" style="color:var(--text);">
              <li><strong>Apoio à decisão, não garantia:</strong> o BREQUE é uma ferramenta educativa e de apoio para pausar decisões sob pressão. Ele <strong>não promete nem garante</strong> impedir golpes, fraudes ou perdas financeiras.</li>
              <li><strong>Sem garantia de recuperação:</strong> orientações sobre contestação bancária, MED ou Boletim de Ocorrência são informativas e não garantem bloqueio ou devolução de valores.</li>
              <li><strong>Não é prova jurídica garantida:</strong> o arquivo <code>relato-breque.txt</code> gerado no aparelho serve apenas para organização pessoal e não substitui laudo, perícia ou decisão judicial.</li>
              <li><strong>Autonomia do usuário:</strong> toda decisão financeira, ligação, bloqueio ou denúncia é de responsabilidade exclusiva do usuário nos canais oficiais.</li>
            </ul>
          </div>

          <div class="card stack">
            <h3>2. Política de Privacidade e LGPD (Lei nº 13.709/2018)</h3>
            <ul class="list-clean">
              <li><strong>Processamento local:</strong> mensagens coladas, respostas do Roteiro Reverso e relatos do incidente rodam 100% no seu aparelho e desaparecem ao fechar a sessão.</li>
              <li><strong>Quando há envio de dado:</strong> apenas se você preencher voluntariamente seu <strong>e-mail e plano de interesse</strong> na tela de Planos (armazenado no Supabase com finalidade exclusiva de avisar sobre disponibilidade do plano).</li>
              <li><strong>Direitos do titular (art. 18 da LGPD):</strong> você pode solicitar confirmação, correção ou exclusão do seu e-mail cadastrado a qualquer momento.</li>
            </ul>
          </div>

          <div class="card card-soft stack">
            <h3>3. O que o BREQUE NÃO faz</h3>
            <ul class="list-clean">
              <li>Não lê WhatsApp, SMS, e-mails nem notificações.</li>
              <li>Não escuta ligações nem monitora sua tela.</li>
              <li>Não acessa contas bancárias, saldos ou transações Pix.</li>
              <li>Não monitora familiares nem envia alertas silenciosos.</li>
              <li>Nunca exibe selo verde dizendo que algo “está seguro”.</li>
            </ul>
            <div class="review-tag">Aviso: textos jurídicos e LGPD devem passar por revisão de advogado especializado antes do lançamento comercial.</div>
          </div>

          <button class="btn btn-primary btn-center" onclick="handleInstallClick()">Como instalar no celular (PWA)</button>
        `;
      }
    }

    // Web Share Target (Android PWA): se o usuário compartilhou um texto/link para o BREQUE, abre direto em Verificar
    const params = new URLSearchParams(window.location.search);
    const sharedText = [params.get("title"), params.get("text"), params.get("url")]
      .filter(Boolean)
      .join(" ")
      .trim()
      .slice(0, 1000);
    if (sharedText) {
      state.verifyText = sharedText;
      state.screen = "verify_start";
    }

    render();
  </script>
</body>
</html>
