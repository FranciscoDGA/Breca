<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>BREQUE — Protótipo Navegável de Alta Fidelidade</title>
  <style>
    :root {
      --bg: #f3f2ee;
      --surface: #ffffff;
      --surface-soft: #f8f7f4;
      --text: #182128;
      --text-muted: #4b5966;
      --primary: #1a4b5c;
      --primary-hover: #133946;
      --primary-soft: #e6f0f3;
      --amber: #8a500d;
      --amber-bg: #fdf4e7;
      --amber-border: #ecc388;
      --risk: #942626;
      --risk-bg: #fdf0f0;
      --risk-border: #ebb3b3;
      --neutral-bg: #eef2f5;
      --neutral-border: #cdd7df;
      --border: #d9dfe4;
      --radius: 16px;
      --radius-sm: 12px;
      --shadow: 0 2px 10px rgba(24, 33, 40, 0.06);
      --font-scale: 1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: calc(16px * var(--font-scale));
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #dfe3e8;
      color: var(--text);
      line-height: 1.5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 36px rgba(0, 0, 0, 0.14);
    }

    .proto-banner {
      background: #23303b;
      color: #f3f6f8;
      font-size: 0.74rem;
      text-align: center;
      padding: 6px 12px;
      letter-spacing: 0.01em;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.12rem;
      letter-spacing: 0.04em;
      color: var(--primary);
      background: none;
      border: none;
      padding: 4px 0;
      cursor: pointer;
    }

    .brand-mark {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--primary);
      display: inline-block;
    }

    .font-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .font-btn {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .font-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
    }

    .content {
      flex: 1;
      padding: 18px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      font-size: 1.38rem;
      line-height: 1.28;
      margin: 0;
      color: var(--text);
    }

    h2 {
      font-size: 1.12rem;
      line-height: 1.3;
      margin: 0;
      color: var(--text);
    }

    h3 {
      font-size: 0.96rem;
      margin: 0 0 4px;
      color: var(--text);
    }

    p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .card-soft {
      background: var(--surface-soft);
      border: 1px solid var(--border);
    }

    .card-amber {
      background: var(--amber-bg);
      border: 1.5px solid var(--amber-border);
    }

    .card-risk {
      background: var(--risk-bg);
      border: 1.5px solid var(--risk-border);
    }

    .card-neutral {
      background: var(--neutral-bg);
      border: 1.5px solid var(--neutral-border);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: var(--radius-sm);
      padding: 15px 16px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background 0.15s ease, transform 0.05s ease;
      line-height: 1.35;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--surface-soft);
    }

    .btn-amber {
      background: var(--amber-bg);
      color: var(--amber);
      border: 1.5px solid var(--amber-border);
    }

    .btn-risk {
      background: var(--risk-bg);
      color: var(--risk);
      border: 1.5px solid var(--risk-border);
    }

    .btn-ghost {
      background: transparent;
      color: var(--primary);
      padding: 6px 2px;
      font-size: 0.92rem;
      font-weight: 700;
      width: auto;
      justify-content: flex-start;
    }

    .btn-center {
      justify-content: center;
      text-align: center;
    }

    .btn-sub {
      display: block;
      font-size: 0.84rem;
      font-weight: 400;
      opacity: 0.9;
      margin-top: 3px;
    }

    .pill {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .pill-primary {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #bfd6de;
    }

    .pill-amber {
      background: var(--amber-bg);
      color: var(--amber);
      border: 1px solid var(--amber-border);
    }

    .pill-risk {
      background: var(--risk-bg);
      color: var(--risk);
      border: 1px solid var(--risk-border);
    }

    .pill-neutral {
      background: var(--neutral-bg);
      color: var(--text);
      border: 1px solid var(--neutral-border);
    }

    .pill-fictional {
      background: #eef2ff;
      color: #3730a3;
      border: 1px solid #c7d2fe;
    }

    .section-label {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .field-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    textarea, input[type="text"] {
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      resize: vertical;
    }

    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    .quote-box {
      background: var(--surface-soft);
      border-left: 4px solid var(--primary);
      padding: 12px 14px;
      border-radius: 0 10px 10px 0;
      font-size: 0.94rem;
      color: var(--text);
      margin-top: 6px;
    }

    .rr-block {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 12px;
    }

    .rr-block:first-child {
      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }

    .rr-title {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 14px;
      cursor: pointer;
      user-select: none;
    }

    .check-item.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .check-box {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 6px;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
      font-weight: 800;
      font-size: 0.84rem;
      color: #fff;
      background: #fff;
    }

    .check-item.selected .check-box {
      background: var(--primary);
      border-color: var(--primary);
    }

    .timer-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--primary-soft);
      border: 1px solid #bfd8e0;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }

    .timer-count {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
      min-width: 44px;
      text-align: center;
    }

    .list-clean {
      margin: 6px 0 0;
      padding-left: 18px;
      color: var(--text-muted);
      font-size: 0.93rem;
    }

    .list-clean li {
      margin-bottom: 6px;
    }

    .review-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #6b4e16;
      background: #fef8e7;
      border: 1px solid #ead39c;
      border-radius: 6px;
      padding: 2px 7px;
      margin-top: 6px;
    }

    .footer-nav {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
      padding: 4px 0;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="phone-frame" role="application" aria-label="BREQUE Protótipo Navegável">
    <div class="proto-banner">
      Protótipo navegável • Conteúdo fictício • Sem conexão com bancos ou apps reais
    </div>

    <header class="topbar">
      <button class="brand" onclick="goHome()" aria-label="Voltar ao início do BREQUE">
        <span class="brand-mark" aria-hidden="true"></span>
        BREQUE
      </button>
      <div class="font-controls" aria-label="Ajustar tamanho da fonte">
        <button class="font-btn" onclick="changeFont(-0.1)" aria-label="Diminuir fonte">A-</button>
        <button class="font-btn" onclick="changeFont(0)" aria-label="Fonte padrão">A</button>
        <button class="font-btn" onclick="changeFont(0.1)" aria-label="Aumentar fonte">A+</button>
      </div>
    </header>

    <main id="app" class="content"></main>

    <footer class="footer-nav">
      <button class="link-btn" onclick="navigate('privacy')">Como o BREQUE usa seus dados</button>
      <button class="link-btn" onclick="navigate('trusted')">Pessoa de confiança</button>
    </footer>
  </div>

  <script>
    // Estado apenas em memória. Nada é persistido nem enviado pela rede.
    const state = {
      screen: "home",
      history: [],
      fontScale: 1,

      // Fluxo B — Verificar algo recebido

      verifyText: "",
      verifyExampleKey: null,
      q1Origin: null,   // "banco" | "familiar_novo" | "desconhecido" | "eu_iniciei"
      q2Pressure: null, // "sim" | "nao" | "nao_sei"
      q3Request: null,  // "dinheiro" | "credencial" | "nenhum"

      // Fluxo C — Pressão acontecendo agora

      pauseSeconds: 0,
      pauseInterval: null,

      // Fluxo D — Já fiz algo
      postEvent: null, // "credencial" | "app" | "pix" | "documento" | "outro"
      postChecked: new Set(),

        time: "",
        summary: "",
        saved: false
      },

      // Fluxo E — Pessoa de confiança (apenas demonstração visual)

        { id: "c1", name: "Maria (Irmã)", note: "Contato fictício de demonstração" }

      selectedContactId: "c1",

    const FICTIONAL_EXAMPLES = {

        q1: "banco",

    // Os 6 estágios do Roteiro Reverso

      },
      6: {
        num: 6,
        titulo: "Está tentando organizar o que aconteceu e buscar ajuda",
        acolhimento: "Organizar os fatos com calma ajuda você a retomar o controle da situação.",
        acaoAgora: "Anote horário, o que aconteceu e o que você já fez, e guarde os comprovantes e prints no seu aparelho.",
        motivo: "Ter a linha do tempo clara facilita o atendimento no banco, no suporte oficial e, se você decidir, no registro de ocorrência.",
        verificacao: "Para registrar ocorrência ou buscar orientação formal, acesse apenas o site oficial da Polícia Civil do seu estado digitado manualmente ou canais oficiais do seu banco.",
        evitar: "Evite compartilhar seus documentos ou comprovantes com desconhecidos que ofereçam “recuperação garantida” nas redes sociais.",
        alternativa: "Se for cansativo organizar tudo hoje, anote apenas o básico agora e peça ajuda a alguém de confiança para revisar depois.",
        quandoPedirAjuda: "Compartilhe o resumo com uma pessoa de confiança quando quiser apoio para revisar os próximos passos.",

    function clearTimer() {
      if (state.pauseInterval) {
        clearInterval(state.pauseInterval);
        state.pauseInterval = null;
      }
      state.pauseSeconds = 0;
    }

    function changeFont(delta) {
      if (delta === 0) {
        state.fontScale = 1;
      } else {
        state.fontScale = Math.min(1.25, Math.max(0.9, +(state.fontScale + delta).toFixed(2)));
      }
      document.documentElement.style.setProperty("--font-scale", state.fontScale);
    }

    function navigate(screen, pushHistory = true) {
      clearTimer();
      if (pushHistory && state.screen !== screen) {
        state.history.push(state.screen);
      }
      state.screen = screen;
      render();
    }

    function goBack() {
      clearTimer();
      const prev = state.history.pop();
      state.screen = prev || "home";
      render();
    }

    function goHome() {
      clearTimer();
      state.history = [];
      state.screen = "home";
      render();
    }

    function startPauseTimer() {
      clearTimer();
      state.pauseSeconds = 10;
      render();
      state.pauseInterval = setInterval(() => {
        state.pauseSeconds -= 1;
        if (state.pauseSeconds <= 0) clearTimer();
        render();
      }, 1000);
    }

    function selectFictionalExample(key) {
      const ex = FICTIONAL_EXAMPLES[key];
      state.verifyInputMode = "exemplo";
      state.verifyExampleKey = key;
      state.verifyText = ex.text;
      state.q1Origin = ex.q1;
      state.q2Pressure = ex.q2;
      state.q3Request = ex.q3;
      navigate("verify_q1");
    }

    function evaluateVerify() {
      const reasons = [];
      let score = 0;

      if (state.q1Origin === "banco") {
        reasons.push("O contato diz ser de banco ou empresa (vale sempre confirmar pelo canal oficial).");
        score += 1;
      } else if (state.q1Origin === "familiar_novo") {
        reasons.push("Alguém conhecido entrou em contato por um número novo.");
        score += 1;
      } else if (state.q1Origin === "desconhecido") {
        reasons.push("O contato veio de um número ou remetente desconhecido.");
        score += 1;
      }

      if (state.q2Pressure === "sim") {
        reasons.push("Há pressão para agir rápido ou manter segredo.");
        score += 2;
      }

      if (state.q3Request === "dinheiro") {
        reasons.push("Houve pedido de dinheiro, Pix ou pagamento.");
        score += 2;
      } else if (state.q3Request === "credencial") {
        reasons.push("Houve pedido de código, senha, documento ou instalação de aplicativo.");
        score += 3;
      }

      if (score >= 3 || state.q3Request === "credencial") {
        return {
          status: "Sinais de risco",
          cardClass: "card-risk",
          pillClass: "pill-risk",
          stage: state.q2Pressure === "sim" ? 3 : 1,
          reasons
        };
      }
      if (score >= 1) {
        return {
          status: "Não dá para confirmar",
          cardClass: "card-amber",
          pillClass: "pill-amber",
          stage: 1,
          reasons
        };
      }
      return {
        status: "Poucos sinais encontrados — ainda vale verificar",
        cardClass: "card-neutral",
        pillClass: "pill-neutral",
        stage: 1,
        reasons: ["Nenhum dos sinais mais comuns foi marcado, mas isso não garante que o contato seja legítimo."]
      };
    }

          <div class="card stack">
            <h3>Emergência policial (190)</h3>
            <p><strong>Como acessar:</strong> Disque 190 diretamente no discador do seu celular se houver risco físico ou ameaça imediata.</p>
            <p style="font-size: 0.82rem;"><strong>Fonte:</strong> Serviço público de emergência policial • <strong>Verificado em:</strong> 2026-11-21</p>
          </div>

          <div class="card stack">
            <h3>Delegacia Virtual / Polícia Civil do seu estado</h3>
            <p><strong>Como acessar:</strong> Digite manualmente o site oficial do governo do seu estado (domínio .gov.br) ou procure uma delegacia presencial.</p>
            <p style="font-size: 0.82rem;"><strong>Fonte:</strong> MJSP / Polícias Civis estaduais • <strong>Verificado em:</strong> 2026-11-21</p>
          </div>

          <div class="card stack">
            <h3>Registrato (Banco Central)</h3>
            <p><strong>Como acessar:</strong> Acesse manualmente bcb.gov.br com sua conta Gov.br para conferir contas, chaves Pix ou empréstimos no seu CPF.</p>
            <p style="font-size: 0.82rem;"><strong>Fonte:</strong> Banco Central do Brasil (bcb.gov.br) • <strong>Verificado em:</strong> 2026-11-21</p>
          </div>

          <div class="card card-soft">
            <h3>Os 6 padrões de coerção que costumam aparecer combinados</h3>
            <p style="margin-bottom: 6px;">Nem todo golpe se reduz a estes padrões, mas eles ajudam a reconhecer pressão fabricada:</p>
            <ul class="list-clean">
              <li><strong>Urgência:</strong> “tem que ser agora, senão você perde”.</li>
              <li><strong>Sigilo:</strong> “não conte para ninguém, não desligue”.</li>
              <li><strong>Falsa autoridade:</strong> diz ser banco, advogado, INSS ou suporte.</li>
              <li><strong>Medo de perda:</strong> “sua conta foi invadida” ou “vão bloquear”.</li>
              <li><strong>Ganho inesperado:</strong> prêmio, precatório ou valor fácil a receber.</li>
              <li><strong>Vínculo afetivo:</strong> “mãe/pai, troquei de número, me ajuda”.</li>
            </ul>
          </div>

          <button class="btn btn-primary btn-center" onclick="goHome()">Voltar ao início</button>
        `;
        return;
      }

      // E. PESSOA DE CONFIANÇA
      if (state.screen === "trusted") {
        const listHtml = state.trustedContacts.map(c => `
          <div class="card card-soft" style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <div>
              <div style="font-weight:700;">${c.name}</div>
              <div style="font-size:0.84rem; color:var(--text-muted);">${c.note}</div>
            </div>
            <button class="btn btn-secondary" style="width:auto; padding:8px 12px; font-size:0.84rem;" onclick="state.selectedContactId='${c.id}'; openHelpPreview('pedido de apoio');">
              Simular pedido
            </button>
          </div>
        `).join("");

        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>

          <div>
            <span class="pill pill-fictional">Demonstração visual</span>
            <h1>Pessoa de confiança</h1>
            <p style="margin-top: 6px;">
              Você decide quando pedir ajuda e vê exatamente o que será compartilhado antes de confirmar.
              O BREQUE <strong>não</strong> rastreia localização, mensagens, atividade nem transações de ninguém.
            </p>
          </div>

          <div class="stack">${listHtml}</div>

          <div class="card stack">
            <h3>Adicionar contato (apenas demonstração)</h3>
            <input type="text" placeholder="Nome (ex.: João - filho)" value="${state.newContactName}" oninput="state.newContactName=this.value" />
            <input type="text" placeholder="Relação (opcional)" value="${state.newContactNote}" oninput="state.newContactNote=this.value" />
            <button class="btn btn-primary btn-center" onclick="addTrustedContact()">
              Adicionar contato fictício
            </button>
          </div>
        `;
        return;
      }

      // PRÉVIA E CONFIRMAÇÃO DE PEDIDO DE AJUDA
      if (state.screen === "help_preview") {
        const contact = state.trustedContacts.find(c => c.id === state.selectedContactId) || state.trustedContacts[0];
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>

          <div>
            <span class="pill pill-primary">Prévia antes de confirmar</span>
            <h1>Pedido de ajuda para ${contact.name}</h1>
            <p style="margin-top: 6px;">Revise o texto abaixo. Nada é enviado sem sua confirmação explícita.</p>
          </div>

          <div class="card stack">
            <label class="field-label" for="help-msg">O que seria compartilhado</label>
            <textarea id="help-msg" rows="4" oninput="state.helpPreviewText=this.value">${state.helpPreviewText}</textarea>

            ${!state.helpSentSimulated ? `
              <button class="btn btn-primary btn-center" onclick="state.helpSentSimulated=true; render();">
                Confirmar simulação de envio
              </button>
            ` : `
              <div class="quote-box">
                <strong>Simulação concluída no protótipo.</strong><br/>
                Nenhuma mensagem real foi enviada e ${contact.name} não recebeu este aviso porque este protótipo não está conectado a serviços reais.
              </div>
            `}
          </div>

          <button class="btn btn-secondary btn-center" onclick="goHome()">Voltar ao início</button>
        `;
        return;
      }

      // VISÃO DOS 6 ESTÁGIOS DO ROTEIRO REVERSO
      if (state.screen === "stages_overview") {
        const tabs = [1, 2, 3, 4, 5, 6].map(n => `
          <button class="font-btn" style="flex:1; padding:8px 0; ${state.activeStage === n ? 'background:var(--primary); color:#fff; border-color:var(--primary);' : ''}" onclick="state.activeStage=${n}; render();">
            ${n}
          </button>
        `).join("");

        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>
          <div>
            <h1>Os 6 estágios do Roteiro Reverso</h1>
            <p style="margin-top: 4px;">Toque em um número para revisar o fluxo pronto de cada estágio.</p>
          </div>
          <div class="row">${tabs}</div>
          ${renderRoteiroCard(state.activeStage)}
        `;
        return;
      }

      // COMO O BREQUE USA SEUS DADOS
      if (state.screen === "privacy") {
        app.innerHTML = `
          <button class="btn btn-ghost" onclick="goBack()">← Voltar</button>

          <div>
            <h1>Como o BREQUE usa seus dados</h1>
            <p style="margin-top: 6px;">Transparência e autonomia em primeiro lugar.</p>
          </div>

          <div class="card">
            <h3>Neste protótipo</h3>
            <ul class="list-clean">
              <li>Tudo funciona apenas nesta tela do seu navegador.</li>
              <li>Nenhum texto, contato ou registro é enviado para servidores.</li>
              <li>Ao fechar ou recarregar a página, as informações digitadas desaparecem.</li>
            </ul>
          </div>

          <div class="card card-soft">
            <h3>O que o BREQUE não faz</h3>
            <ul class="list-clean">
              <li>Não lê WhatsApp, SMS, e-mails nem notificações.</li>
              <li>Não escuta ligações nem monitora sua tela.</li>
              <li>Não rastreia localização ou atividade de familiares.</li>
              <li>Não faz Pix, bloqueios nem denúncias sem você.</li>
              <li>Nunca exibe um selo verde dizendo que algo “está seguro”.</li>
            </ul>
          </div>

          <button class="btn btn-primary btn-center" onclick="goHome()">Entendi, voltar ao início</button>
        `;
      }
    }

    function togglePostCheck(idx) {
      if (state.postChecked.has(idx)) {
        state.postChecked.delete(idx);
      } else {
        state.postChecked.add(idx);
      }
      render();
    }

    function openIncidentLog() {
      if (!state.incidentLog.time) {
        const now = new Date();
        state.incidentLog.time = now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      }
      if (!state.incidentLog.summary && state.verifyText) {
        state.incidentLog.summary = state.verifyText;
      }
      state.incidentLog.saved = false;
      navigate("incident_log");
    }

    function addTrustedContact() {
      const name = state.newContactName.trim();
      if (!name) return;
      const id = "c" + (state.trustedContacts.length + 1);
      state.trustedContacts.push({
        id,
        name,
        note: state.newContactNote.trim() || "Contato fictício de demonstração"
      });
      state.newContactName = "";
      state.newContactNote = "";
      render();
    }

    render();
  </script>
</body>
</html>
