<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2f3d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BREQUE" />
  <meta name="description" content="BREQUE — Copiloto contra golpes. Interrompa decisões sob pressão, verifique por outro canal e aja com calma." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="BREQUE" />
  <meta property="og:title" content="BREQUE — Copiloto contra golpes" />
  <meta property="og:description" content="Um breque na hora da dúvida. Interrompa decisões sob pressão, verifique por outro canal e aja com calma. Tudo processado no seu aparelho." />
  <meta property="og:url" content="https://breca-rho.vercel.app/" />
  <meta property="og:image" content="https://breca-rho.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BREQUE — Copiloto contra golpes" />
  <meta name="twitter:description" content="Um breque na hora da dúvida. Interrompa decisões sob pressão e verifique por outro canal." />
  <meta name="twitter:image" content="https://breca-rho.vercel.app/og-image.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>BREQUE — Copiloto contra golpes</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafb;
      --text: #0f1b24;
      --text-muted: #4b5c6b;
      --brand: #0f2f3d;
      --brand-2: #17465a;
      --brand-soft: #e6f0f4;
      --accent: #b45309;
      --accent-bg: #fff8eb;
      --accent-border: #f3d092;
      --risk: #991b1b;
      --risk-bg: #fef2f2;
      --risk-border: #f2bcbc;
      --neutral-bg: #eef2f5;
      --neutral-border: #cfd8e0;
      --border: #e1e7ec;
      --radius: 18px;
      --radius-sm: 13px;
      --shadow-sm: 0 2px 10px rgba(15, 27, 36, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 47, 61, 0.12);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --font-scale: 1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: calc(16px * var(--font-scale));
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.48;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .proto-strip {
      background: #0b222c;
      color: #e2eff5;
      font-size: 0.8rem;
      line-height: 1.35;
      text-align: center;
      padding: 8px 14px;
      font-weight: 500;
    }

    .topbar {
      background: var(--brand);
      color: #ffffff;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 10px rgba(15, 47, 61, 0.15);
    }

    .brand-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      padding: 4px 0;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-pill {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      border-radius: 999px;
      min-height: 36px;
      padding: 6px 12px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 150ms var(--ease-out), background-color 150ms ease;
    }

    .top-pill:active {
      transform: scale(0.96);
    }

    @media (hover: hover) and (pointer: fine) {
      .top-pill:hover {
        background: rgba(255, 255, 255, 0.26);
      }
    }

    .content {
      flex: 1;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 18px 16px 96px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hero {
      background: radial-gradient(circle at 85% 15%, rgba(14, 165, 198, 0.38) 0%, rgba(12, 46, 66, 0.92) 55%, #091d2b 100%);
      color: #ffffff;
      border-radius: var(--radius);
      border: 1px solid rgba(56, 189, 248, 0.28);
      padding: 22px 18px;
      box-shadow: var(--shadow-md);
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #fde68a;
      margin-bottom: 8px;
    }

    .hero h1 {
      color: #ffffff;
      font-size: 1.32rem;
      line-height: 1.28;
      margin: 0;
    }

    .hero p {
      color: #d6e6ed;
      font-size: 0.9rem;
      margin-top: 8px;
    }

    h1 {
      font-size: 1.35rem;
      line-height: 1.26;
      margin: 0;
      color: var(--text);
    }

    h2 {
      font-size: 1.08rem;
      line-height: 1.3;
      margin: 0;
      color: var(--text);
    }

    h3 {
      font-size: 0.96rem;
      margin: 0 0 4px;
      color: var(--text);
    }

    p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.93rem;
    }

    h1, h2, h3 {
      text-wrap: balance;
      font-feature-settings: "kern" 1;
    }

    .panel-titulo {
      font-size: clamp(1.35rem, 1.15rem + 1vw, 1.8rem);
      line-height: 1.22;
      letter-spacing: -0.01em;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .card-soft {
      background: var(--surface-soft);
      border: 1px solid var(--border);
    }

    .card-amber {
      background: var(--accent-bg);
      border: 1.5px solid var(--accent-border);
    }

    .card-risk {
      background: var(--risk-bg);
      border: 1.5px solid var(--risk-border);
    }

    .card-neutral {
      background: var(--neutral-bg);
      border: 1.5px solid var(--neutral-border);
    }

    .action-card {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 15px 14px;
      display: flex;
      align-items: center;
      gap: 13px;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 150ms var(--ease-out), border-color 150ms ease;
    }

    .action-card:active {
      transform: scale(0.975);
    }

    .action-card.primary-tone {
      border-color: rgba(56, 189, 248, 0.3);
      background: rgba(15, 39, 56, 0.88);
    }

    .action-card.amber-tone {
      border: 2px solid rgba(251, 191, 36, 0.72);
      background: linear-gradient(155deg, rgba(245, 158, 11, 0.2) 0%, rgba(15, 35, 50, 0.94) 100%);
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.16);
      padding: 18px 16px;
    }

    .priority-badge {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 800;
      color: #7c2d12;
      background: #fde68a;
      border: 1px solid #d97706;
      border-radius: 999px;
      padding: 2px 10px;
      margin-bottom: 5px;
    }

    .action-card.amber-tone .priority-badge {
      color: #fde68a;
      background: rgba(245, 158, 11, 0.22);
      border-color: rgba(251, 191, 36, 0.5);
    }

    .action-card.risk-tone {
      border-color: var(--risk-border);
      background: linear-gradient(155deg, rgba(220, 38, 38, 0.18) 0%, rgba(15, 31, 45, 0.94) 100%);
    }

    .icon-badge {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-brand {
      background: rgba(14, 165, 198, 0.2);
      color: #38bdf8;
    }

    .icon-amber {
      background: rgba(245, 158, 11, 0.22);
      color: #fbbf24;
    }

    .icon-risk {
      background: rgba(239, 68, 68, 0.22);
      color: #fca5a5;
    }

    .action-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text);
      display: block;
    }

    .action-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      display: block;
      margin-top: 3px;
      line-height: 1.38;
    }

    .tools-panel {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tile-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 12px;
      min-height: 76px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      text-align: left;
      cursor: pointer;
      transition: transform 150ms var(--ease-out), border-color 150ms ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .tile-btn:hover {
        border-color: #bfd6e0;
      }
    }

    .tile-btn:active {
      transform: scale(0.975);
    }

    .tile-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
    }

    .tile-sub {
      font-size: 0.83rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      line-height: 1.35;
    }

    .btn-primary {
      background: var(--brand);
      color: #ffffff;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
    }

    .btn-risk {
      background: var(--risk-bg);
      color: var(--risk);
      border: 1.5px solid var(--risk-border);
    }

    .btn-ghost {
      background: transparent;
      color: var(--brand);
      padding: 4px 0;
      font-size: 0.9rem;
      font-weight: 700;
      width: auto;
      justify-content: flex-start;
    }

    .btn-center {
      justify-content: center;
      text-align: center;
    }

    .section-label {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .section-eyebrow {
      display: block;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--brand-2);
      margin-bottom: 6px;
    }

    .bento {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .bento-item { min-width: 0; }
    .bento-item--wide { grid-column: span 2; }

    .manifesto-strip {
      background: var(--brand);
      color: #e8f1f5;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius);
      padding: 18px 16px;
      box-shadow: var(--shadow-md);
    }

    .manifesto-strip .section-eyebrow { color: #9ecfe2; }
    .manifesto-strip h3 { color: #ffffff; }
    .manifesto-strip blockquote {
      margin: 0;
      font-size: clamp(1.2rem, 1rem + 1vw, 1.55rem);
      font-weight: 800;
      line-height: 1.25;
      text-wrap: balance;
    }
    .manifesto-strip em { color: #fde68a; font-style: normal; }
    .manifesto-strip p, .manifesto-strip li { color: #d6e6ed; }

    .pill {
      display: inline-block;
      font-size: 0.73rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .pill-brand { background: var(--brand-soft); color: var(--brand); }
    .pill-amber { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }
    .pill-risk { background: var(--risk-bg); color: var(--risk); border: 1px solid var(--risk-border); }
    .pill-neutral { background: var(--neutral-bg); color: var(--text); border: 1px solid var(--neutral-border); }
    .pill-fictional { background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; }

    .field-label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    textarea, input[type="text"] {
      width: 100%;
      font-family: inherit;
      font-size: 0.94rem;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      resize: vertical;
    }

    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--brand);
    }

    .quote-box {
      background: var(--surface-soft);
      border-left: 4px solid var(--brand);
      padding: 12px 14px;
      border-radius: 0 12px 12px 0;
      font-size: 0.92rem;
      color: var(--text);
    }

    .rr-block {
      border-top: 1px solid var(--border);
      padding-top: 11px;
      margin-top: 11px;
    }

    .rr-title {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--brand);
      margin-bottom: 4px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 14px;
      cursor: pointer;
      user-select: none;
    }

    .check-item.selected {
      border-color: var(--brand);
      background: var(--brand-soft);
    }

    .check-box {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 6px;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.82rem;
      color: #fff;
      background: #fff;
    }

    .check-item.selected .check-box {
      background: var(--brand);
      border-color: var(--brand);
    }

    .timer-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--brand-soft);
      border: 1px solid #bfd6e0;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }

    .timer-count {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--brand);
      min-width: 44px;
      text-align: center;
    }

    .list-clean {
      margin: 6px 0 0;
      padding-left: 18px;
      color: var(--text-muted);
      font-size: 0.91rem;
    }

    .list-clean li {
      margin-bottom: 6px;
    }

    .review-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #6b4e16;
      background: #fef8e7;
      border: 1px solid #ead39c;
      border-radius: 6px;
      padding: 3px 8px;
      margin-top: 8px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      z-index: 30;
    }

    .nav-item {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 2px;
      min-height: 48px;
    }

    .nav-item.active {
      color: var(--brand);
    }

    .secondary-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .welcome-screen {
      flex: 1;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      padding: 64px 28px 44px;
      background:
        radial-gradient(circle at 20% 12%, rgba(16, 185, 129, 0.34) 0%, transparent 48%),
        radial-gradient(circle at 82% 16%, rgba(14, 165, 233, 0.34) 0%, transparent 46%),
        radial-gradient(circle at 50% 92%, rgba(56, 189, 248, 0.55) 0%, rgba(7, 32, 52, 0.92) 48%, #040b11 100%);
    }

    .welcome-waves {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.9;
    }

    .welcome-center {
      position: relative;
      z-index: 2;
      margin-top: auto;
      margin-bottom: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 340px;
    }

    .welcome-shield {
      width: 78px;
      height: 78px;
      border-radius: 24px;
      background: rgba(10, 32, 46, 0.72);
      border: 1.5px solid rgba(186, 230, 253, 0.35);
      box-shadow: 0 0 36px rgba(56, 189, 248, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-title {
      font-size: 1.72rem;
      font-weight: 800;
      line-height: 1.22;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .welcome-sub {
      font-size: 0.96rem;
      line-height: 1.5;
      color: #cfe4f0;
      margin: 0;
    }

    .welcome-actions {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .welcome-visitor {
      background: none;
      border: none;
      color: #e6f4fa;
      font-size: 0.84rem;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      min-height: 44px;
      padding: 8px 14px;
      border-radius: 999px;
    }

    .welcome-go {
      position: relative;
      z-index: 2;
      min-height: 56px;
      padding: 14px 28px;
      border-radius: 999px;
      border: 1.5px solid rgba(255, 255, 255, 0.34);
      background: #f59e0b;
      color: #0b222c;
      font-size: 1rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      transition: transform 160ms var(--ease-out), background-color 150ms ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .welcome-go:hover {
        background: #fbbf24;
        transform: scale(1.03);
      }
    }

    .welcome-go:active {
      transform: scale(0.96);
    }

    .hidden-chrome {
      display: none !important;
    }

    .status-glass {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 14px;
      background: var(--brand-soft);
      border: 1px solid #c5dce5;
      color: var(--brand);
      font-size: 0.86rem;
      font-weight: 600;
    }

    .audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1.5px solid #c5dce5;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
    }

    .audio-btn[aria-pressed="true"] {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
    }

    .audio-aviso {
      font-size: 0.78rem;
      color: var(--text-muted);
      min-height: 1em;
    }

    .details-bloco {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 13px;
    }

    .details-bloco > summary {
      cursor: pointer;
      min-height: 44px;
      display: flex;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 800;

    .glass-card-sub {

    .summary-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);

    .summary-row {
      width: 100%;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
      transition: transform 150ms var(--ease-out), background-color 150ms ease, border-color 150ms ease;

    .summary-row:active {
      transform: scale(0.98);
    }

    @media (hover: hover) and (pointer: fine) {

        border-color: #bfd6e0;

    }

    .btn:active {
      transform: scale(0.97);
    }

    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: var(--brand);
      transform-origin: left center;
      transition: transform 250ms var(--ease-out);
    }

    @media (prefers-reduced-motion: reduce) {
      .btn, .action-card, .glass-card, .arc-hero, .tile-btn, .summary-row, .top-pill, .welcome-go, .progress-bar-fill {
        transition-duration: 0.01ms !important;
      }
      .btn:active, .action-card:active, .glass-card:active, .arc-hero:active, .tile-btn:active, .summary-row:active, .top-pill:active, .welcome-go:active {

    .summary-icon {

    @media (min-width: 768px) {

    @media print {

  <script>

    const CHAVES_LOCAIS = {
      cofre: "breca.cofre.v1",

      planoPessoal: "breca.planoPessoal.v1",
      vacinaAgenda: "breca.vacinaAgenda.v1",
      med: "breca.med.v1",
      medDatas: "breca.medDatas.v1",
      bancoFavorito: "breca.bancoFavorito.v1",
      operadora: "breca.operadora.v1",
      fontScale: "breca.fontScale.v1",
      boasVindasVistas: "breca.boasVindasVistas.v1",
      saltLocal: "breca.saltLocal.v1"
    };

    function lerLocal(chave, padrao) {
      try {
        const bruto = localStorage.getItem(chave);
        return bruto ? JSON.parse(bruto) : padrao;
      } catch {
        return padrao;
      }
    }

    function gravarLocal(chave, valor) {
      try {
        localStorage.setItem(chave, JSON.stringify(valor));
      } catch {
        // Sem localStorage (modo privado): o app continua funcionando na sessão.
      }
    }

    // Salt local: impede que hashes salvos no aparelho sejam descobertos por
    // dicionário (CPF e telefone são previsíveis). Nada é enviado à rede.
    function obterSaltLocal() {
      try {
        const atual = localStorage.getItem(CHAVES_LOCAIS.saltLocal);
        if (atual && /^[a-f0-9]{32}$/.test(atual)) return atual;
        const bytes = new Uint8Array(16);
        if (window.crypto && typeof window.crypto.getRandomValues === "function") {
          window.crypto.getRandomValues(bytes);
        }
        const novo = Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
        localStorage.setItem(CHAVES_LOCAIS.saltLocal, novo);
        return novo;
      } catch {
        return "00000000000000000000000000000000";
      }
    }
    const SALT_LOCAL = obterSaltLocal();

    function apagarTodosOsDadosLocais() {
      if (!window.confirm("Apagar todos os dados deste aparelho? Isso inclui cofre, favorecidos, relatos, métricas e o salt local. Não há cópia em servidor.")) return;
      try {
        Object.values(CHAVES_LOCAIS).forEach((chave) => localStorage.removeItem(chave));
      } catch {
        // Sem storage, nada a apagar.
      }
      // Recarrega para descartar também texto colado e relatos em memória.
      window.location.reload();
    }

    state.cofre = lerLocal(CHAVES_LOCAIS.cofre, []);
    state.favorecidos = lerLocal(CHAVES_LOCAIS.favorecidos, []);
    state.denunciasLocais = lerLocal(CHAVES_LOCAIS.denuncias, []);
    const sentinelaSalva = lerLocal(CHAVES_LOCAIS.sentinela, null);
    if (sentinelaSalva && typeof sentinelaSalva === "object") {
      state.sentinela.optIn = !!sentinelaSalva.optIn;
      state.sentinela.uf = String(sentinelaSalva.uf || "").slice(0, 2).toUpperCase();
      state.sentinela.relatos = Array.isArray(sentinelaSalva.relatos) ? sentinelaSalva.relatos : [];
    }
    state.metricas = { ...state.metricas, ...lerLocal(CHAVES_LOCAIS.metricas, {}) };
    state.compromisso = { ...state.compromisso, ...lerLocal(CHAVES_LOCAIS.compromisso, {}) };
    const fontScaleSalvo = Number(lerLocal(CHAVES_LOCAIS.fontScale, 1));
    if (Number.isFinite(fontScaleSalvo) && fontScaleSalvo >= 0.9 && fontScaleSalvo <= 1.25) {
      state.fontScale = +fontScaleSalvo.toFixed(2);
      document.documentElement.style.setProperty("--font-scale", state.fontScale);
    }
    const REGRAS_PLANO_FALLBACK = [
      {

      {

      },
      {

        compromisso: "Se disserem que preciso agir imediatamente ou perder algo em minutos, vou parar e verificar com calma.",
        lembretePressao: "Você combinou consigo: diante de pressa ou prazo de minutos, parar antes de decidir.",
        topicos: ["dinheiro", "banco", "familiar", "ameaca", "investimento", "suporte", "selfie_inss", "advogado", "maquininha", "outro"],
        sugerida: true
      },
      {

        topicos: ["suporte", "banco", "selfie_inss"],
        sugerida: false
      },
      {
        id: "usar_canal_do_cartao",
        tituloCurto: "Ligar só pelo verso do cartão",
        compromisso: "Se alguém disser ser do banco, vou encerrar e procurar o número do verso do cartão ou o app oficial.",

      },

        tituloCurto: "Ouvir uma segunda opinião antes",
        compromisso: "Antes de transferir um valor fora do comum sob pressão, vou pausar e falar com alguém de confiança.",
        lembretePressao: "Você combinou consigo: ouvir uma segunda opinião antes de fazer transferência sob pressão.",
        topicos: ["dinheiro", "investimento", "ameaca", "familiar", "advogado", "maquininha"],
        sugerida: false
      }
    ];
    const OPCOES_APOIO_FALLBACK = [
      { id: "nenhum", rotulo: "Sem preferência registrada", lembrete: "" },
      { id: "familiar", rotulo: "Falar com um familiar antes de decidir", lembrete: "Seu lembrete de apoio: conversar com um familiar antes de concluir." },
      { id: "pessoa_confianca", rotulo: "Ouvir uma pessoa de confiança (sem nome salvo aqui)", lembrete: "Seu lembrete de apoio: ouvir uma pessoa de confiança compartilhando só o que você escolher." },
      { id: "canal_oficial", rotulo: "Confirmar primeiro no canal oficial da instituição", lembrete: "Seu lembrete de apoio: confirmar antes pelo canal oficial no verso do cartão ou app." }
    ];
    function normalizarPlanoPessoalLocal(entrada) {
      if (window.BREQUE_PLANO_PESSOAL && typeof window.BREQUE_PLANO_PESSOAL.normalizar === "function") {
        return window.BREQUE_PLANO_PESSOAL.normalizar(entrada);
      }
      if (!entrada || typeof entrada !== "object") {
        return { regrasIds: [], papelApoio: "nenhum", atualizadoEm: "" };
      }
      const validos = new Set(REGRAS_PLANO_FALLBACK.map((r) => r.id));
      const marcados = new Set(
        Array.isArray(entrada.regrasIds)
          ? entrada.regrasIds.filter((id) => typeof id === "string" && validos.has(id))
          : []
      );
      const regrasIds = REGRAS_PLANO_FALLBACK.filter((r) => marcados.has(r.id)).map((r) => r.id);
      const papeisValidos = new Set(OPCOES_APOIO_FALLBACK.map((p) => p.id));
      const papelApoio = typeof entrada.papelApoio === "string" && papeisValidos.has(entrada.papelApoio)
        ? entrada.papelApoio
        : "nenhum";
      const atualizadoEm = typeof entrada.atualizadoEm === "string" && /^\d{4}-\d{2}-\d{2}$/.test(entrada.atualizadoEm)

        : "";
      return { regrasIds, papelApoio, atualizadoEm };
    }
    state.planoPessoal = normalizarPlanoPessoalLocal(lerLocal(CHAVES_LOCAIS.planoPessoal, null));
    state.pausa = { ...state.pausa, ...lerLocal(CHAVES_LOCAIS.pausa, {}) };

    const medDatasSalvas = lerLocal(CHAVES_LOCAIS.medDatas, {});

      return `${min}min ${String(resto).padStart(2, "0")}s`;

    function migrarCofreLegado() {

      let alterou = false;
      state.cofre = state.cofre
        .map((entrada) => {
          if (entrada.hash) return { hash: entrada.hash, criadoEm: entrada.criadoEm || 0 };
          const hash = window.BRECODE.hashDestinoCofre(entrada.nome || "", SALT_LOCAL);
          if (!hash) return null;
          alterou = true;
          return { hash, criadoEm: entrada.criadoEm || 0 };
        })
        .filter(Boolean);
      if (alterou) salvarCofre();

      const hash = window.BREQUE_ESCUDO.hashChavePixLocal(chave, SALT_LOCAL);
      if (!hash || state.favorecidos.some((f) => f.hash === hash)) {
        state.escudo.feedback = "Este hash já está nos seus Favorecidos Verificados.";

      state.escudo.feedback = "Salvo como identificador com salt neste aparelho. Nenhuma chave ou apelido foi gravado.";

      const canal = canais.find((c) =>
        c.dominios.some((d) => bruto === d || bruto.endsWith("." + d))
      );
      const pareceBanco = /(banco|itau|bradesco|santander|nubank|caixa|sicredi|sicoob|picpay|mercadopago|correios|receita|inss|banpara)/.test(bruto)
        || /(^|[.-])(bb|inter|c6|gov)([.-]|$)/.test(bruto);
      state.registroCanais.resultado = canal
        ? { tipo: "OFICIAL", texto: `${bruto} pertence a ${canal.nome} (${canal.tipo}) no catálogo local. Ainda assim, confirme no app oficial.` }
        : pareceBanco
          ? { tipo: "SUSPEITO", texto: `${bruto} cita nome de banco ou órgão, mas NÃO está no catálogo local. Digite o endereço oficial manualmente.` }
          : { tipo: "DESCONHECIDO", texto: `${bruto} não está no catálogo local. Isso não prova que é golpe, mas confirme por outro canal.` };
      render();
    }

    function canaisFiltrados(termo) {
      const canais = canaisOficiais();
      if (window.BREQUE_CANAIS && typeof window.BREQUE_CANAIS.buscar === "function") {
        return window.BREQUE_CANAIS.buscar(termo, canais);
      }
      const alvo = normalizeText(termo);
      if (!alvo) return canais;
      return canais.filter((c) =>
        normalizeText([c.nome, c.tipo, ...(c.dominios || [])].join(" ")).includes(alvo)
      );
    }

    function numeroDiscavel(numero, dddInterurbano) {
      if (window.BREQUE_CANAIS && typeof window.BREQUE_CANAIS.formatarDiscagem === "function") {

      }
      if (window.BREQUE_CANAIS && typeof window.BREQUE_CANAIS.discavel === "function") {
        return window.BREQUE_CANAIS.discavel(numero);

      return String(numero || "").replace(/\D/g, "");

    function renderListaCanais(termo) {
      const lista = canaisFiltrados(termo);

        const ehFavorito = state.bancoFavoritoId === canal.id;
        const telefonesHtml = (canal.telefones || []).map((tel) => {
          const discar = numeroDiscavel(tel.numero, tel.dddInterurbano);
          if (!discar) return "";
          const dataLinha = formatarDataBr(tel.verificadoEm || canal.verificadoEm);
          const fonteUrl = urlHttpsSegura(tel.fonte || canal.fonte);

              ${state.operadoraCodigo && discar !== String(tel.numero || "").replace(/\D/g, "") ? `<div style="font-size:0.76rem; color:var(--brand);">Discando com operadora ${escapeHtml(state.operadoraCodigo)}: <strong>${escapeHtml(discar)}</strong></div>` : ""}

                <strong>Fonte oficial:</strong> ${fonteUrl ? `<a href="${escapeHtml(fonteUrl)}" target="_blank" rel="noopener noreferrer" style="color:var(--brand); text-decoration:underline;">abrir página oficial</a>` : "<span>fonte indisponível</span>"}
                • <span>verificado pela equipe em ${escapeHtml(dataLinha)}</span>
              </div>
            </div>
          `;
        }).join("");

        const linksHtml = (canal.links || []).map((lnk) => {
          const linkUrl = urlHttpsSegura(lnk.url);
          if (!linkUrl) return "";
          const fonteUrl = urlHttpsSegura(lnk.fonte || canal.fonte);
          const dataLinha = formatarDataBr(lnk.verificadoEm || canal.verificadoEm);

            <div style="border:1.5px solid var(--border); border-radius:14px; padding:12px; background:var(--surface-soft); display:flex; flex-direction:column; gap:6px;">
              <a class="btn btn-secondary" style="text-decoration:none; text-align:left; display:block; padding:11px 14px;" href="${escapeHtml(linkUrl)}" target="_blank" rel="noopener noreferrer">

              </a>
              <div style="font-size:0.82rem; color:var(--text);">${escapeHtml(lnk.descricao)}</div>
              <div style="font-size:0.74rem; color:var(--text-muted);">
                <strong>Fonte oficial:</strong> ${fonteUrl ? `<a href="${escapeHtml(fonteUrl)}" target="_blank" rel="noopener noreferrer" style="color:var(--brand); text-decoration:underline;">abrir página oficial</a>` : "<span>fonte indisponível</span>"}
                • <span>verificado pela equipe em ${escapeHtml(dataLinha)}</span>
              </div>
            </div>
          `;
        }).join("");

        return `
          <div class="card ${canal.destaqueRegional ? "card-amber" : ""} stack" style="padding:16px;">
            <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap;">
              <div>

                  ${ehFavorito ? `<span class="pill pill-brand">Meu banco na tela inicial</span>` : ""}
                </div>
                <div style="font-weight:800; font-size:1.06rem;">${escapeHtml(canal.nome)}</div>
                <div style="font-size:0.8rem; color:var(--text-muted);">${escapeHtml((canal.dominios || []).join(", ") || "sem domínio informado")}</div>
              </div>
              <span class="pill pill-neutral" style="white-space:nowrap;">${escapeHtml(canal.tipo)}</span>
            </div>

            ${canal.semTelefonePublico ? `
              <div class="card card-risk" style="padding:12px; margin:0;">
                <strong>Atenção: sem telefone público</strong>
                <p style="font-size:0.86rem; color:var(--text); margin-top:4px;">${escapeHtml(canal.avisoEspecial || "Atendimento apenas dentro do aplicativo oficial.")}</p>

    function downloadFamilyCardPng() {
      const canvas = document.createElement("canvas");
      canvas.width = 1080;
      canvas.height = 1350;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      // Fundo limpo
      ctx.fillStyle = "#f4f6f8";
      ctx.fillRect(0, 0, 1080, 1350);

      // Topo azul-petróleo
      ctx.fillStyle = "#0f2f3d";
      ctx.fillRect(0, 0, 1080, 290);

      ctx.fillStyle = "#fde68a";
      ctx.font = "bold 32px sans-serif";
      ctx.fillText("CARTÃO DE BOLSO DA FAMÍLIA • BREQUE", 70, 105);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 56px sans-serif";
      ctx.fillText("Na dúvida, dê um BREQUE.", 70, 190);

      ctx.fillStyle = "#d6e6ed";
      ctx.font = "30px sans-serif";
      ctx.fillText("3 passos para proteger quem você ama", 70, 245);

      // 3 Passos
      const passos = [
        ["1. PAUSE E DESLIGUE", "Quem é do banco ou da família de verdade espera."],
        ["2. CONFIRME POR OUTRO CANAL", "Use o número antigo ou o telefone no verso do cartão."],
        ["3. NUNCA PASSE CÓDIGOS", "Banco não pede código de SMS, senha nem instalar app."]
      ];

      let y = 370;
      passos.forEach(([titulo, desc]) => {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(70, y, 940, 185);
        ctx.strokeStyle = "#d9e2e8";
        ctx.lineWidth = 3;
        ctx.strokeRect(70, y, 940, 185);

        ctx.fillStyle = "#0f2f3d";
        ctx.font = "bold 36px sans-serif";
        ctx.fillText(titulo, 110, y + 72);

        ctx.fillStyle = "#334155";
        ctx.font = "30px sans-serif";
        ctx.fillText(desc, 110, y + 132);
        y += 220;
      });

      // Bloco Pergunta Secreta
      ctx.fillStyle = "#fff8eb";
      ctx.fillRect(70, 1045, 940, 180);
      ctx.strokeStyle = "#d49b38";
      ctx.lineWidth = 4;
      ctx.strokeRect(70, 1045, 940, 180);

      ctx.fillStyle = "#92400e";
      ctx.font = "bold 34px sans-serif";
      ctx.fillText("LEMBRETE: PERGUNTA SECRETA DA FAMÍLIA", 110, 1110);

      ctx.fillStyle = "#1e293b";
      ctx.font = "28px sans-serif";
      const hint = state.cardFamilyHint.trim() || "Faça a pergunta que combinamos pessoalmente antes de fazer Pix.";
      ctx.fillText(hint.slice(0, 58), 110, 1170);

      ctx.fillStyle = "#64748b";
      ctx.font = "24px sans-serif";
      ctx.fillText("BREQUE • Apoio à decisão • Não substitui confirmação oficial com seu banco", 70, 1295);

      const url = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = url;
      a.download = "cartao-familia-breque.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      state.cardDownloaded = true;
      render();
    }

      const log = state.incidentLog;
      const acoesMarcadas = etapasMedLista()

          tipoIncidente: log.tipoIncidente || "pix_golpe",
          dataPix: log.data || "",
          quandoRecebeu: log.quandoRecebeu || log.canal || "",
          quandoPagou: log.quandoPagou || log.time || "",
          quandoContestou: log.quandoContestou || "",
          dataContestacao: log.dataContestacao || "",
          valor: log.valor || "",
          chaveDestino: log.chave || "",
          telefoneSuspeito: log.telefoneSuspeito || "",
          linkSuspeito: log.linkSuspeito || "",
          nomeUsado: log.nomeUsado || "",
          transacaoId: log.transacaoId || "",
          protocoloBanco: log.protocoloBanco || "",
          protocoloBo: log.protocoloBo || "",
          relato: log.summary || "",
          acoesMarcadas
        });
      }

      const fallbackTxt = [
        "DOSSIÊ DE CONTESTAÇÃO / MED — BREQUE (USO PESSOAL)",
        `Data do Pix: ${log.data || "Não informada"}`,
        `Valor: ${log.valor || "Não informado"}`,
        `Chave de destino: ${log.chave || "Não informada"}`,
        `Relato: ${log.summary || "Não informado"}`
      ].join("\n");
      return { textoTxt: fallbackTxt, hashSha256: "", jsonEstruturado: JSON.stringify({ relato: log.summary || "" }, null, 2) };
    }

    function clearTimer() {
      if (state.pauseInterval) {
        clearInterval(state.pauseInterval);
        state.pauseInterval = null;
      }
      if (state.pausaInterval) {
        clearInterval(state.pausaInterval);
        state.pausaInterval = null;
      }
      if (state.simuladoInterval) {
        clearInterval(state.simuladoInterval);
        state.simuladoInterval = null;
      }
      if (state.simulado.ativo) {
        state.simulado.ativo = false;
        state.simulado.inicio = 0;
        state.simulado.segundos = 0;
        state.simulado.mensagem = "";
      }
      state.pauseSeconds = 0;
      stopCalmGuidance();
    }

    function stopCalmGuidance() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      state.isSpeaking = false;
      audioTelaAtivo = false;
      utteranceTela = null;
      passoAudioAtivo = false;
      atualizarBotoesAudio();
      atualizarPainelPassos();
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    function toggleCalmGuidance() {
      if (!("speechSynthesis" in window)) return;
      if (state.isSpeaking) {
        stopCalmGuidance();
        render();
        return;
      }

      pararAudioPasso();
      pararAudioTela();
      const synth = window.speechSynthesis;
      synth.cancel();
      synth.resume();

      const text =
        "Respira fundo. Você não precisa fazer nada agora. Não informe códigos, senhas ou dados bancários. Você pode desligar a ligação agora mesmo. Quem é do banco ou da sua família de verdade vai entender e esperar.";
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "pt-BR";
      utter.rate = 0.88;
      utter.pitch = 0.98;
      utter.volume = 1;

      const voices = synth.getVoices();
      const ptVoice =
        voices.find(v => /pt[-_]BR/i.test(v.lang) && /natural|google|luciana|francisca|maria|antonio/i.test(v.name)) ||
        voices.find(v => /pt[-_]BR/i.test(v.lang)) ||
        voices.find(v => /^pt/i.test(v.lang));
      if (ptVoice) utter.voice = ptVoice;

      utter.onend = () => { state.isSpeaking = false; render(); };
      utter.onerror = () => { state.isSpeaking = false; render(); };

      state.isSpeaking = true;
      render();

      setTimeout(() => {
        synth.resume();
        synth.speak(utter);
      }, 80);
    }

    function atualizarBotoesAudio() {
      document.querySelectorAll('[data-audio-toggle]').forEach((botao) => {
        botao.setAttribute('aria-pressed', audioTelaAtivo ? 'true' : 'false');
        const rotulo = botao.querySelector('[data-audio-label]');
        if (rotulo) rotulo.textContent = audioTelaAtivo ? 'Parar áudio' : 'Ouvir esta tela';
      });
    }

    function pararAudioTela() {
      if (audioTelaAtivo || utteranceTela) {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
      audioTelaAtivo = false;
      utteranceTela = null;
      atualizarBotoesAudio();
    }

    function textoVisivelParaAudio() {
      const app = document.getElementById('app');
      if (!app) return '';
      return Array.from(app.querySelectorAll('[data-audio]'))
        .filter((elemento) => !elemento.closest('details:not([open])'))
        .map((elemento) => (elemento.getAttribute('data-audio') || '').trim())
        .filter(Boolean)
        .join(' ');
    }

    function alternarAudioTela() {
      if (audioTelaAtivo) {
        pararAudioTela();
        return;
      }
      if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
        const aviso = document.getElementById('audio-aviso');
        if (aviso) aviso.textContent = 'Sem voz local neste aparelho. Você pode continuar lendo as instruções.';
        return;
      }
      const texto = textoVisivelParaAudio();
      if (!texto) return;
      pararAudioTela();
      const synth = window.speechSynthesis;
      synth.cancel();
      synth.resume();
      const utter = new SpeechSynthesisUtterance(texto);
      utter.lang = 'pt-BR';
      utter.rate = 0.95;
      utter.pitch = 1;
      utter.volume = 1;
      const voices = synth.getVoices();
      const ptVoice = voices.find((v) => /pt[-_]BR/i.test(v.lang)) || voices.find((v) => /^pt/i.test(v.lang));
      if (ptVoice) utter.voice = ptVoice;
      const finalizar = () => {
        audioTelaAtivo = false;
        utteranceTela = null;
        atualizarBotoesAudio();
      };
      utter.onend = finalizar;
      utter.onerror = finalizar;
      audioTelaAtivo = true;
      utteranceTela = utter;
      atualizarBotoesAudio();
      setTimeout(() => {
        synth.resume();
        synth.speak(utter);
      }, 60);
    }

    function atualizarPainelPassos() {
      const texto = document.getElementById("passo-audio-texto");
      if (texto) texto.textContent = PASSOS_AUDIO_EXTREMOS[passoAtualAudio];
      const botao = document.getElementById("passo-audio-botao");
      if (botao) botao.textContent = passoAudioAtivo ? "Parar áudio" : `Ouvir passo ${passoAtualAudio + 1}`;
    }

    function pararAudioPasso() {
      if (passoAudioAtivo && "speechSynthesis" in window) window.speechSynthesis.cancel();
      passoAudioAtivo = false;
      atualizarPainelPassos();
    }

    function reproduzirPassoAudio() {
      if (passoAudioAtivo) {
        pararAudioPasso();
        return;
      }
      if (state.isSpeaking) {
        stopCalmGuidance();
        render();
      }
      if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
        const aviso = document.getElementById("passo-audio-aviso");
        if (aviso) aviso.textContent = "Sem voz local neste aparelho. Continue lendo as instruções.";
        return;
      }
      pararAudioTela();
      const synth = window.speechSynthesis;
      synth.cancel();
      synth.resume();
      const utter = new SpeechSynthesisUtterance(PASSOS_AUDIO_EXTREMOS[passoAtualAudio]);
      utter.lang = "pt-BR";
      utter.rate = 0.92;
      utter.pitch = 1;
      utter.volume = 1;
      const voices = synth.getVoices();
      const ptVoice = voices.find((v) => /pt[-_]BR/i.test(v.lang)) || voices.find((v) => /^pt/i.test(v.lang));
      if (ptVoice) utter.voice = ptVoice;
      const finalizar = () => {
        passoAudioAtivo = false;
        atualizarPainelPassos();
      };
      utter.onend = finalizar;
      utter.onerror = finalizar;
      passoAudioAtivo = true;
      atualizarPainelPassos();
      setTimeout(() => {
        synth.resume();
        synth.speak(utter);
      }, 60);
    }

    function repetirPassoAudio() {
      pararAudioPasso();
      reproduzirPassoAudio();
    }

    function avancarPassoAudio() {
      pararAudioPasso();
      passoAtualAudio = (passoAtualAudio + 1) % PASSOS_AUDIO_EXTREMOS.length;
      atualizarPainelPassos();
      reproduzirPassoAudio();
    }

      return `<details class="details-bloco">

      let mensagem = "Frase copiada. Cole onde precisar.";

        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          await navigator.clipboard.writeText(frase);
        } else {
          mensagem = "Selecione a frase para copiar.";
        }
      } catch {
        mensagem = "Não foi possível copiar. Selecione a frase.";

    let wakeLockSentinel = null;
    let navegandoPorPopstate = false;
    const TELAS_MANTER_ACESA = new Set([
      "pressure_pause",
      "pressure_topic",
      "pressure_guide",
      "pausa_programada",
      "post_start",
      "post_plan",
      "incident_log",
      "discagem_segura"
    ]);

    async function gerenciarWakeLockTela(screen) {
      const precisa = TELAS_MANTER_ACESA.has(screen);
      if (!precisa) {
        if (wakeLockSentinel) {
          try { await wakeLockSentinel.release(); } catch {}
          wakeLockSentinel = null;
        }
        return;
      }
      if (!("wakeLock" in navigator) || !navigator.wakeLock || typeof navigator.wakeLock.request !== "function") return;
      if (document.visibilityState && document.visibilityState !== "visible") return;
      if (wakeLockSentinel) return;
      try {
        wakeLockSentinel = await navigator.wakeLock.request("screen");
        wakeLockSentinel.addEventListener("release", () => {
          wakeLockSentinel = null;
        });
      } catch {
        wakeLockSentinel = null;
      }
    }

    function atualizarFaixaOffline() {
      const strip = document.getElementById("proto-strip");
      if (!strip) return;
      const offline = typeof navigator !== "undefined" && navigator.onLine === false;
      strip.textContent = offline
        ? "Modo offline ativo • O BREQUE segue funcionando 100% no seu aparelho"
        : "BREQUE • Processamento local no aparelho • Não acessa bancos nem WhatsApp";
    }

    function limparUrlAtual(screen) {
      try {
        if (window.history && typeof window.history.replaceState === "function") {
          window.history.replaceState({ brequeScreen: screen, brequeDepth: 0 }, "", window.location.pathname);
        }
      } catch {
        // Ambiente sem history API gravável (ex.: file://) segue normalmente.
      }
    }

    function changeFont(delta) {
      state.fontScale = Math.min(1.25, Math.max(0.9, +(state.fontScale + delta).toFixed(2)));
      document.documentElement.style.setProperty("--font-scale", state.fontScale);
      if (!state.visitante) gravarLocal(CHAVES_LOCAIS.fontScale, state.fontScale);
    }

    async function handleInstallClick() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
      } else {
        navigate("install_guide");
      }
    }

    function navigate(screen, pushHistory = true) {
      clearTimer();
      if (pushHistory && state.screen !== screen) {
        state.history.push(state.screen);
        if (!navegandoPorPopstate) {
          try {
            if (window.history && typeof window.history.pushState === "function") {
              window.history.pushState(
                { brequeScreen: screen, brequeDepth: state.history.length },
                "",
                window.location.pathname
              );
            }
          } catch {}
        }
      }
      state.screen = screen;
      if (screen === "discagem_segura") registrarSinalSeguro("Canal oficial aberto");
      gerenciarWakeLockTela(screen);
      render();
    }

    function goBack() {
      clearTimer();
      state.screen = state.history.pop() || "home";
      gerenciarWakeLockTela(state.screen);
      render();
    }

    function goHome() {
      clearTimer();
      if (!state.visitante) gravarLocal(CHAVES_LOCAIS.boasVindasVistas, true);
      state.history = [];
      state.screen = "home";
      limparUrlAtual("home");
      gerenciarWakeLockTela("home");
      render();
    }

    function startPauseTimer() {
      clearTimer();
      registrarSinalSeguro("Pausa iniciada");
      state.pauseSeconds = 10;
      render();
      state.pauseInterval = setInterval(() => {
        state.pauseSeconds -= 1;
        if (state.pauseSeconds <= 0) clearTimer();
        render();
      }, 1000);
    }

    function startBreathTimer() {
      if (state.pauseInterval) {
        clearInterval(state.pauseInterval);
        state.pauseInterval = null;
      }
      state.pauseSeconds = 10;
      render();
      state.pauseInterval = setInterval(() => {
        state.pauseSeconds -= 1;
        if (state.pauseSeconds <= 0) {
          clearInterval(state.pauseInterval);
          state.pauseInterval = null;
          state.pauseSeconds = 0;
        }

      return window.BREQUE_PLANO_PESSOAL && Array.isArray(window.BREQUE_PLANO_PESSOAL.opcoesApoio)

    function salvarPlanoPessoalLocal(novoPlano, aviso) {
      state.planoPessoal = normalizarPlanoPessoalLocal(novoPlano);
      gravarLocal(CHAVES_LOCAIS.planoPessoal, {

      });

    function alternarRegraPlanoLocal(regraId) {
      const hoje = new Date().toISOString().slice(0, 10);
      let proximo;
      if (window.BREQUE_PLANO_PESSOAL && typeof window.BREQUE_PLANO_PESSOAL.alternarRegra === "function") {
        proximo = window.BREQUE_PLANO_PESSOAL.alternarRegra(state.planoPessoal, regraId, hoje);
      } else {
        const atual = normalizarPlanoPessoalLocal(state.planoPessoal);
        const conjunto = new Set(atual.regrasIds);
        if (conjunto.has(regraId)) conjunto.delete(regraId);
        else conjunto.add(regraId);
        proximo = normalizarPlanoPessoalLocal({
          regrasIds: Array.from(conjunto),
          papelApoio: atual.papelApoio,
          atualizadoEm: hoje
        });
      }
      salvarPlanoPessoalLocal(
        proximo,
        proximo.regrasIds.length
          ? `Plano salvo neste aparelho (${proximo.regrasIds.length} regra${proximo.regrasIds.length === 1 ? "" : "s"} escolhida${proximo.regrasIds.length === 1 ? "" : "s"}).`
          : "Nenhuma regra marcada. O app fica em silêncio na tela de pausa até você escolher alguma."
      );
    }

        : normalizarPlanoPessoalLocal({ ...state.planoPessoal, papelApoio: papel, atualizadoEm: hoje });

    function selecionarRegrasPressaoLocal(topico, limite = 3) {
      if (state.visitante) return [];
      const plano = normalizarPlanoPessoalLocal(state.planoPessoal);
      if (!plano.regrasIds.length) return [];
      if (window.BREQUE_PLANO_PESSOAL && typeof window.BREQUE_PLANO_PESSOAL.selecionarParaPressao === "function") {
        return window.BREQUE_PLANO_PESSOAL.selecionarParaPressao(plano, topico, limite);
      }
      const mapa = new Map(obterRegrasPlanoPessoal().map((r) => [r.id, r]));
      const ativas = plano.regrasIds.map((id) => mapa.get(id)).filter(Boolean);
      if (!topico) return ativas.slice(0, limite);
      const prioritarias = ativas.filter((r) => Array.isArray(r.topicos) && r.topicos.includes(topico));
      const demais = ativas.filter((r) => !prioritarias.includes(r));
      return [...prioritarias, ...demais].slice(0, limite);
    }

    function salvarCompromisso() {
      const valInput = document.getElementById("compromisso-valor");
      const durInput = document.getElementById("compromisso-duracao");
      const confInput = document.getElementById("compromisso-confianca");
      const valorBruto = valInput ? Number(valInput.value) : state.compromisso.valorMinimo;
      const duracaoBruta = durInput ? Number(durInput.value) : state.compromisso.duracaoMin;
      const limitarVal = window.BREQUE_AGENDA && window.BREQUE_AGENDA.limitarValorCompromisso
        ? window.BREQUE_AGENDA.limitarValorCompromisso
        : (v) => (Number.isFinite(v) && v >= 10 ? Math.min(100000, Math.round(v)) : 200);
      const limitarDur = window.BREQUE_AGENDA && window.BREQUE_AGENDA.limitarDuracaoPausaMin
        ? window.BREQUE_AGENDA.limitarDuracaoPausaMin
        : (v) => (Number.isFinite(v) && v >= 1 ? Math.min(1440, Math.round(v)) : 60);

      state.compromisso = {
        valorMinimo: limitarVal(valorBruto),
        duracaoMin: limitarDur(duracaoBruta),
        confirmarConfianca: confInput ? !!confInput.checked : !!state.compromisso.confirmarConfianca,
        configurado: true
      };
      gravarLocal(CHAVES_LOCAIS.compromisso, state.compromisso);
      state.pausaAviso = `Compromisso salvo no aparelho: Pix novo acima de R$ ${state.compromisso.valorMinimo} → esperar ${formatarDuracaoCurta(state.compromisso.duracaoMin)}.`;
      render();
    }

    function formatarDuracaoCurta(minutos) {
      const m = Number(minutos) || 60;
      if (m >= 60 && m % 60 === 0) {
        const h = m / 60;
        return h === 1 ? "1 hora" : `${h} horas`;
      }
      return `${m} minutos`;
    }

    function salvarPausa() {
      gravarLocal(CHAVES_LOCAIS.pausa, {
        ativo: !!state.pausa.ativo,
        inicio: state.pausa.inicio || 0,
        duracaoMin: state.pausa.duracaoMin || 60,
        motivo: state.pausa.motivo || "banco",
        concluida: !!state.pausa.concluida
      });
    }

    function estadoAtualJornada() {
      if (window.BREQUE_AGENDA && typeof window.BREQUE_AGENDA.avaliarEstadoJornada === "function") {
        return window.BREQUE_AGENDA.avaliarEstadoJornada(state.pausa, Date.now());
      }
      const dur = state.pausa.duracaoMin || 60;
      const total = dur * 60;
      if (state.pausa.ativo && state.pausa.inicio) {
        const rest = Math.max(0, Math.round((state.pausa.inicio + dur * 60000 - Date.now()) / 1000));
        if (rest > 0) {
          return { fase: "em_andamento", restanteSegundos: rest, totalSegundos: total, progressoPct: Math.min(100, Math.round(((total - rest) / total) * 100)) };
        }
        return { fase: "concluida", restanteSegundos: 0, totalSegundos: total, progressoPct: 100 };
      }
      return { fase: state.pausa.concluida ? "concluida" : "inativa", restanteSegundos: 0, totalSegundos: total, progressoPct: state.pausa.concluida ? 100 : 0 };
    }

    function restantePausaSegundos() {
      return estadoAtualJornada().restanteSegundos;
    }

    function notificarLocalBestEffort(titulo, corpo, tag) {
      try {
        if (!("Notification" in window)) return;
        const aviso = () => {
          try {
            new Notification(titulo, { body: corpo, tag });
          } catch {
            // Notificação é só um lembrete extra; o app funciona sem ela.
          }
        };
        if (Notification.permission === "granted") aviso();
        else if (Notification.permission === "default") {
          Notification.requestPermission().then((p) => { if (p === "granted") aviso(); }).catch(() => {});
        }
      } catch {
        // Sem permissão ou API: ignora.
      }
    }

    function sincronizarConclusaoJornada() {
      const est = estadoAtualJornada();
      if (state.pausa.ativo && est.fase === "concluida") {
        state.pausa.ativo = false;
        state.pausa.concluida = true;
        salvarPausa();
        if (state.pausaInterval) {
          clearInterval(state.pausaInterval);
          state.pausaInterval = null;
        }
        const textoFim = (window.BREQUE_AGENDA && window.BREQUE_AGENDA.textoFim) ||
          "Passou a hora. Golpista não espera. Se a pessoa continua com pressa, é sinal vermelho.";
        notificarLocalBestEffort("BREQUE — Jornada de Espera concluída", textoFim, "breca-pausa-fim");
        return true;
      }
      return false;
    }

      state.pausa = {
        ativo: true,
        inicio: Date.now(),
        duracaoMin: duracao,
        motivo: state.pausa.motivo || "banco",
        concluida: false
      };
      state.pausaAviso = "";
      salvarPausa();
      notificarPausaBestEffort(duracao);

    function dataLimiteMed() {
      const bruto = state.incidentLog.data;
      if (!bruto || !/^\d{4}-\d{2}-\d{2}$/.test(bruto)) return null;
      const base = new Date(bruto + "T12:00:00");
      if (Number.isNaN(base.getTime())) return null;
      return new Date(base.getTime() + 80 * 86400000);
    }

    function diasRestantesMed() {
      const limite = dataLimiteMed();
      if (!limite) return null;
      const hoje = new Date();
      hoje.setHours(12, 0, 0, 0);
      return Math.ceil((limite.getTime() - hoje.getTime()) / 86400000);
    }

    async function gerarHashRelato() {
      state.incidentLog.hash = "";
      state.incidentLog.hashErro = "";
      try {
        const texto = montarRelatoIncidente();
        const bytes = new TextEncoder().encode(texto);
        const digest = await crypto.subtle.digest("SHA-256", bytes);
        state.incidentLog.hash = Array.from(new Uint8Array(digest))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      } catch {
        state.incidentLog.hashErro = "Este navegador não permitiu gerar a impressão digital. O relato continua disponível para .txt e impressão.";
      }
      render();
    }

    function imprimirRelato() {
      const alvo = document.getElementById("relato-print");
      if (!alvo) return;
      alvo.textContent = montarRelatoIncidente();
      alvo.hidden = false;
      document.body.classList.add("modo-impressao");
      try {
        window.print();
      } catch {
        // Se a impressão falhar, o usuário ainda pode baixar o .txt.
      }
      setTimeout(() => {
        document.body.classList.remove("modo-impressao");
        alvo.hidden = true;
      }, 800);
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Só abre links https vindos do catálogo verificado. Nunca aceita javascript: ou http:.
    function urlHttpsSegura(url) {
      try {
        const u = new URL(String(url || ""));
        return u.protocol === "https:" ? u.href : "";
      } catch {
        return "";
      }
    }

    function normalizeText(str) {
      return (str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function analyzeLocalTextOrLink(raw) {
      const text = (raw || "").trim();
      if (!text) return null;
      const norm = normalizeText(text);
      const findings = [];
      let score = 0;

      // 1. Análise estrutural de link (sem acessar o site)
      const urlMatch = text.match(/(https?:\/\/[^\s]+|www\.[^\s]+|[a-z0-9-]+\.(com|net|org|xyz|top|site|online|click|vip|info|br)(\/[^\s]*)?)/i);
      if (urlMatch) {
        const rawUrl = urlMatch[0].toLowerCase();
        if (/^http:\/\//.test(rawUrl)) {
          findings.push("O link usa HTTP sem criptografia (não tem HTTPS).");
          score += 1;
        }
        if (/(bit\.ly|tinyurl\.com|t\.co|cutt\.ly|rb\.gy|shorturl)/i.test(rawUrl)) {
          findings.push("Link encurtado: esconde o endereço real do site de destino.");
          score += 2;
        }
        if (/\.(xyz|top|click|site|online|vip|info)\b/i.test(rawUrl)) {
          findings.push("Terminação de domínio muito usada em páginas temporárias de golpe.");
          score += 2;
        }
        if (/(gov|correios|receita|inss|itau|bradesco|santander|nubank|caixa|serasa|bb\.|mercadopago)/i.test(rawUrl) && !/\.gov\.br\b/i.test(rawUrl)) {
          findings.push("O link cita banco ou órgão conhecido fora de um domínio oficial verificado.");
          score += 3;
        }
        if (/\b\d{1,3}(\.\d{1,3}){3}\b/.test(rawUrl)) {
          findings.push("O link aponta para um número IP direto em vez de um site oficial.");
          score += 3;
        }
      }

      // 2. Análise dos 6 padrões de coerção + pedidos sensíveis
      const rules = [
        { name: "Urgência", pts: 2, re: /(urgente|agora|imediatamente|hoje ainda|ultima chance|em ate \d|prazo|rapido|retido|vai bloquear)/ },
        { name: "Sigilo", pts: 3, re: /(nao conta|nao fale|nao desligue|sigiloso|confidencial|entre nos|apaga essa)/ },
        { name: "Falsa autoridade", pts: 2, re: /(central de seguranca|central de atendimento|gerente|ouvidoria|advogado|precatorio|receita federal|inss|suporte tecnico)/ },
        { name: "Medo de perda", pts: 2, re: /(conta foi invadida|cartao foi clonado|compra suspeita|vao bloquear|emprestimo no seu nome|devolucao|negativado)/ },
        { name: "Ganho inesperado", pts: 2, re: /(voce foi sorteado|premio|valores a receber|resgate|indenizacao|restituicao|bonus)/ },
        { name: "Vínculo afetivo", pts: 2, re: /(troquei de numero|numero novo|numero provisorio|oi mae|oi pai|celular quebrou|depois te devolvo)/ },
        { name: "Pedido sensível", pts: 3, re: /(pix|boleto|taxa|transferencia|codigo|sms|senha|instalar|aplicativo|anydesk|teamviewer)/ }
      ];

      rules.forEach(r => {
        if (r.re.test(norm)) {
          findings.push(`Padrão identificado no texto: ${r.name}.`);
          score += r.pts;
        }
      });

      if (score >= 4) {
        return {
          status: "Sinais de risco",
          cardClass: "card-risk",
          pillClass: "pill-risk",
          stage: 3,
          findings
        };
      }
      if (score >= 1) {
        return {
          status: "Não dá para confirmar",
          cardClass: "card-amber",
          pillClass: "pill-amber",
          stage: 1,
          findings
        };
      }
      return {
        status: "Poucos sinais encontrados — ainda vale verificar",
        cardClass: "card-neutral",
        pillClass: "pill-neutral",
        stage: 1,
        findings: ["Nenhum dos padrões locais mais comuns apareceu no texto/link, mas isso não garante que seja legítimo."]
      };
    }

    function evaluateVerify() {
      const reasons = [];
      let score = 0;
      if (state.q1Origin === "banco") { reasons.push("O contato diz ser de banco, loja ou empresa."); score += 1; }
      else if (state.q1Origin === "familiar_novo") { reasons.push("Alguém conhecido entrou em contato por um número novo."); score += 1; }
      else if (state.q1Origin === "desconhecido") { reasons.push("O contato veio de um número ou remetente desconhecido."); score += 1; }

      if (state.q2Pressure === "sim") { reasons.push("Há pressão para agir rápido ou manter segredo."); score += 2; }
      if (state.q3Request === "dinheiro") { reasons.push("Houve pedido de dinheiro, Pix ou pagamento."); score += 2; }
      else if (state.q3Request === "credencial") { reasons.push("Houve pedido de código, senha, documento ou instalação de aplicativo."); score += 3; }

      if (score >= 3 || state.q3Request === "credencial") {
        return { status: "Sinais de risco", cardClass: "card-risk", pillClass: "pill-risk", stage: state.q2Pressure === "sim" ? 3 : 1, reasons };
      }
      if (score >= 1) {
        return { status: "Não dá para confirmar", cardClass: "card-amber", pillClass: "pill-amber", stage: 1, reasons };
      }
      return {
        status: "Poucos sinais encontrados — ainda vale verificar",
        cardClass: "card-neutral",
        pillClass: "pill-neutral",
        stage: 1,
        reasons: ["Nenhum dos sinais mais comuns foi marcado, mas isso não comprova que o contato seja legítimo."]
      };
    }

              <li>Não acessa contas bancárias, saldos ou transações Pix.</li>
              <li>Não monitora familiares nem envia alertas silenciosos.</li>
              <li>Nunca exibe selo verde dizendo que algo “está seguro”.</li>
            </ul>
            <div class="review-tag">Aviso: textos jurídicos e LGPD devem passar por revisão de advogado especializado antes do lançamento comercial.</div>
          </div>

          <button class="btn btn-primary btn-center" onclick="handleInstallClick()">Como instalar no celular (PWA)</button>
          <button class="btn btn-secondary btn-center" onclick="alternarModoVisitante()">${state.visitante ? "Sair do modo visitante" : "Ativar modo visitante (ocultar dados locais)"}</button>
          <button class="btn btn-ghost btn-center" style="font-size:0.86rem;" onclick="apagarTodosOsDadosLocais()">Apagar todos os meus dados deste aparelho</button>
        `;
      }
    }

    // Web Share Target (Android PWA) e atalhos rápidos do ícone.
    // Remove sempre os parâmetros da URL (replaceState) para que nenhum texto
    // compartilhado fique no histórico do navegador (regra 4 do AGENTS.md).
    const params = new URLSearchParams(window.location.search);
    const sharedText = [params.get("title"), params.get("text"), params.get("url")]
      .filter(Boolean)
      .join(" ")
      .trim()
      .slice(0, 1000);
    const modoPwaInstalado = Boolean(
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
      window.navigator.standalone === true
    );
    const boasVindasJaVistas = lerLocal(CHAVES_LOCAIS.boasVindasVistas, false) === true;

    if (sharedText) {
      state.verifyText = sharedText;
      state.screen = "verify_start";
    } else if (params.get("atalho") === "pressao") {
      state.screen = "pressure_pause";
    } else if (params.get("atalho") === "socorro") {
      registrarSinalSeguro("Socorro aberto");
      state.screen = "post_start";
    } else if (params.get("atalho") === "escudo") {
      state.screen = "escudo_pix";
    } else if (params.get("atalho") === "raiox") {
      state.screen = "raio_x";
    } else if (params.get("atalho") === "verificar") {
      state.screen = "verify_start";
    } else if (params.get("install") === "1") {
      state.screen = "install_guide";
    } else if (boasVindasJaVistas || modoPwaInstalado) {
      state.screen = "home";
    }

    limparUrlAtual(state.screen);
    atualizarFaixaOffline();
    gerenciarWakeLockTela(state.screen);

    window.addEventListener("popstate", (ev) => {
      if (state.history.length > 0) {
        navegandoPorPopstate = true;
        clearTimer();
        const anterior = state.history.pop();
        state.screen = (ev.state && ev.state.brequeScreen) || anterior || "home";
        gerenciarWakeLockTela(state.screen);
        render();
        navegandoPorPopstate = false;
      } else if (state.screen !== "home" && state.screen !== "welcome") {
        navegandoPorPopstate = true;
        clearTimer();
        state.screen = "home";
        gerenciarWakeLockTela("home");
        render();
        navegandoPorPopstate = false;
      }
    });

    window.addEventListener("online", atualizarFaixaOffline);
    window.addEventListener("offline", atualizarFaixaOffline);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        gerenciarWakeLockTela(state.screen);
      }
    });

    render();
    window.addEventListener("breque:modulos-prontos", () => {
      migrarCofreLegado();
      state.planoPessoal = normalizarPlanoPessoalLocal(lerLocal(CHAVES_LOCAIS.planoPessoal, null));
      render();
    });
  </script>
</body>
</html>
